<!doctype html>
<html>
<head><meta charset="utf-8"><title>audioxt web device test</title></head>
<body>
<!-- Opened by run-web-test.cjs. The button is the "first click" a browser
     waits for before it lets a page make sound. -->
<button id="go">click</button>
<script>
var Module = { onRuntimeInitialized: function () {
  window.auReady = true;
  // ?atload: the page opens the device itself as soon as it can, before any
  // gesture, and prints the engine's clock to the console. The test never
  // calls into such a page, because in Playwright a page.evaluate counts as
  // a gesture and would let the device start at once.
  if (location.search.indexOf('atload') >= 0) {
    if (Module.ccall('w_start', 'number', [], []) < 8000)
      console.log('auclock refused ' + Module.ccall('w_error', 'string', [], []));
    setInterval(function () { console.log('auclock ' + Module.ccall('w_time', 'number', [], [])); }, 100);
  }
} };
</script>
<script src="audioxt_page.js"></script>
</body>
</html>
