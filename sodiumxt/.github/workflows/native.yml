# GENERATED by tools/sync-member-workflows.py
# from the suite's .github/workflows/native-sodiumxt.yml (https://github.com/SethMorrowSoftware/xtalk-suite).
#
# This is SodiumXT's native build matrix as its OWN repository runs it. Inside the
# suite monorepo this file is inert (GitHub Actions reads only the root
# .github/workflows/), and the root copy is the one that fires there; the two
# are held identical up to the monorepo-isms by the generator's --check in the
# suite's gate set, so the lanes, flags, runners and assertions here are the
# ones the suite runs, not a snapshot of them.
#
# What the generator removed, and why each removal is right for a standalone
# repository: the `paths:` filters (this repository IS the member, so every
# push is in scope), the `working-directory: sodiumxt` defaults (the checkout root
# is the member root here), and the `sodiumxt/` prefix on artifact paths.
#
# Do not edit this file by hand, here or in the suite: edit the root workflow
# in the suite and re-run `python3 tools/sync-member-workflows.py`. The
# suite's publisher (tools/publish-members.py) carries every change into the
# member's own repository; an edit made there directly is refused by the next
# publish until it is ported back into the suite.
name: native sodiumxt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-sodiumxt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitize:
    name: ASan + UBSan (gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build + test under sanitizers
        # A crypto binding is exactly where an off-by-one in buffer sizing
        # hides, so the smoke test's short-buffer and bad-handle cases run
        # instrumented. gcc: clang's ASan runtime is not on the runner image.
        env:
          CC: gcc
        run: |
          cmake -S . -B build-asan \
            -DSODIUMXT_BUILD_TESTS=ON \
            -DSODIUMXT_SANITIZE=ON
          cmake --build build-asan --parallel 4
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error

  build-matrix:
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
            ext: so
          - os: ubuntu-24.04
            platform: x86-linux
            ext: so
            multilib: true
            configure_args: "-DCMAKE_C_FLAGS=-m32 -DSODIUMXT_LIBSODIUM_CFLAGS=-m32 -DSODIUMXT_LIBSODIUM_CONFIGURE_EXTRA=--host=i686-pc-linux-gnu"
          - os: macos-15
            platform: universal-mac
            ext: dylib
            configure_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSODIUMXT_LIBSODIUM_CFLAGS="-arch arm64 -arch x86_64"'
          - os: windows-2025
            platform: x86_64-win32
            ext: dll
            msvc_arch: amd64
            triplet: x64-windows-static
          - os: windows-2025
            platform: x86-win32
            ext: dll
            msvc_arch: x86
            triplet: x86-windows-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install 32-bit toolchain (Linux x86)
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # RUN the library that is actually COMMITTED, before the build below
      # overwrites it. This member had no such step until 2026-08-16, which
      # left a real hole: every other lane here builds fresh from source and
      # asks whether THAT is correct, so the blobs under src/code/ - the ones
      # an OXT user actually binds against - were verified only by their
      # export list and their hash. coinxt has executed its committed
      # libraries since Phase 4; sodiumxt is the member where it matters most
      # right now, because ABI 8/9 added the ristretto255 and DLEQ surface
      # that holde-em's Level 2 deal binds to and NOTHING had ever executed
      # the committed copies of it.
      #
      # The expected ABI is read from the shim header, never written here as
      # a literal (native-coinxt.yml carried one and the 4 -> 5 bump duly
      # turned its lanes red for no reason but the workflow file).
      #
      # The vectors are the load-bearing ones and no more: the three
      # published RFC 9496 Appendix A.1 basepoint multiples (which pin the
      # encoding and would catch a miscompiled field), then the group law and
      # the ABI 9 follow-ons checked AGAINST those - add/sub, general
      # scalarmult agreeing with scalarmult_base, and the batch crossing
      # agreeing with the single one. A bad point is refused.
      #
      #
      # And one ChaCha20 vector (added 2026-09-24): RFC 8439 Appendix A.2 #1,
      # the counter-0 keystream under a zero key and nonce, then the xor run
      # back to zeros. The ABI 10 raw stream xor is NIP-44's cipher, so
      # nostrxt's whole encryption layer rides it, and until this date the
      # committed copies of it were proved only by their export list and
      # their hash. tests/sodium_smoke_test.c keeps the full KAT set (the
      # multi-block and sunscreen vectors, the refusals); this step asks only
      # "does the blob a user binds against compute the published answer".
      #
      # Linux .so lanes only, and the reason is the lane, not the blob: this
      # driver is a Linux dlopen() program, and the macos-15 lane builds
      # fresh rather than loading what is committed. The universal-mac dylib
      # has been a release-built ABI 10 blob since release run 12
      # (2026-08-27); until then it was a hand-made lipo build recorded at
      # ABI 6, which is what this comment said until 2026-09-24. Its slices
      # are executed in release-binaries.yml's mac lane when a dispatch
      # builds them (arm64 natively, x86_64 under Rosetta), not here.
      - name: Execute the COMMITTED library's ristretto and ChaCha20 vectors
        if: matrix.ext == 'so'
        shell: bash
        run: |
          set -euo pipefail
          lib="src/code/${{ matrix.platform }}/sodiumxt.so"
          if [ ! -f "$lib" ]; then
            echo "no committed library for ${{ matrix.platform }}; nothing to execute"
            exit 0
          fi
          want_abi="$(sed -n 's/^#define SXT_ABI_VERSION \([0-9][0-9]*\).*/\1/p' src/sodium_shim.h)"
          if [ -z "$want_abi" ]; then
            echo "FAIL: could not read SXT_ABI_VERSION from src/sodium_shim.h"
            exit 1
          fi
          echo "  the shim header declares ABI $want_abi"
          cat > /tmp/rdrive.c <<'DRIVER'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          /* RFC 9496 Appendix A.1: the encodings of [1]B, [2]B and [3]B. */
          static const char *kB1 =
            "e2f2ae0a6abc4e71a884a961c500515f58e30b6aa582dd8db6a65945e08d2d76";
          static const char *kB2 =
            "6a493210f7499cd17fecb510ae0cea23a110e8d5b901f8acadd3095c73a3b919";
          static const char *kB3 =
            "94741f5d5d52755ece4f23f044ee27d5d1ea1e2bd196b462166b16152a9d0259";
          static int hexeq(const unsigned char *b, int n, const char *want) {
            char h[160]; int i;
            for (i = 0; i < n; i++) sprintf(h + 2 * i, "%02x", b[i]);
            return strcmp(h, want) == 0;
          }
          static void unhex(const char *h, unsigned char *out, int n) {
            int i; unsigned v;
            for (i = 0; i < n; i++) { sscanf(h + 2 * i, "%2x", &v); out[i] = (unsigned char)v; }
          }
          int main(int argc, char **argv) {
            void *so; int want_abi, rc;
            int (*abi)(void);
            int (*pbytes)(void);
            int (*sbytes)(void);
            int (*multbase)(unsigned char *, int, const unsigned char *, int);
            int (*mult)(unsigned char *, int, const unsigned char *, int,
                        const unsigned char *, int);
            int (*padd)(unsigned char *, int, const unsigned char *, int,
                        const unsigned char *, int);
            int (*psub)(unsigned char *, int, const unsigned char *, int,
                        const unsigned char *, int);
            int (*valid)(const unsigned char *, int);
            int (*batch)(unsigned char *, int, const unsigned char *, int,
                         const unsigned char *, int);
            int (*cxor)(unsigned char *, int, const unsigned char *, int,
                        const unsigned char *, int, const unsigned char *, int);
            unsigned char b1[32], b2[32], b3[32], out[64], sc[32], pts[64], bad[32];
            unsigned char ckey[32], cnonce[12], czero[64], cback[64];
            if (argc < 3) return 2;
            want_abi = atoi(argv[2]);
            so = dlopen(argv[1], RTLD_NOW);
            if (!so) { printf("dlopen failed: %s\n", dlerror()); return 1; }
            *(void **)&abi      = dlsym(so, "sxt_abi_version");
            *(void **)&pbytes   = dlsym(so, "sxt_ristretto_bytes");
            *(void **)&sbytes   = dlsym(so, "sxt_ristretto_scalarbytes");
            *(void **)&multbase = dlsym(so, "sxt_ristretto_scalarmult_base");
            *(void **)&mult     = dlsym(so, "sxt_ristretto_scalarmult");
            *(void **)&padd     = dlsym(so, "sxt_ristretto_add");
            *(void **)&psub     = dlsym(so, "sxt_ristretto_sub");
            *(void **)&valid    = dlsym(so, "sxt_ristretto_is_valid_point");
            *(void **)&batch    = dlsym(so, "sxt_ristretto_scalarmult_batch");
            *(void **)&cxor     = dlsym(so, "sxt_chacha20_ietf_xor");
            if (!abi || !pbytes || !sbytes || !multbase || !mult || !padd ||
                !psub || !valid || !batch || !cxor) {
              printf("a required sxt_ symbol is missing\n"); return 1;
            }
            printf("  abi_version = %d (the shim header says %d)\n", abi(), want_abi);
            if (abi() != want_abi) {
              printf("FAIL: the committed library answers ABI %d, src/sodium_shim.h"
                     " declares %d -- rebuild and re-commit the binary in the same"
                     " change\n", abi(), want_abi);
              return 1;
            }
            if (pbytes() != 32 || sbytes() != 32) {
              printf("FAIL: ristretto point/scalar widths are %d/%d, not 32/32\n",
                     pbytes(), sbytes());
              return 1;
            }
            unhex(kB1, b1, 32); unhex(kB2, b2, 32); unhex(kB3, b3, 32);
            /* [k]B for k = 1,2,3 against the published encodings. */
            memset(sc, 0, sizeof sc); sc[0] = 1;
            if (multbase(out, 32, sc, 32) != 32 || !hexeq(out, 32, kB1)) {
              printf("FAIL: [1]B did not match RFC 9496\n"); return 1;
            }
            sc[0] = 2;
            if (multbase(out, 32, sc, 32) != 32 || !hexeq(out, 32, kB2)) {
              printf("FAIL: [2]B did not match RFC 9496\n"); return 1;
            }
            sc[0] = 3;
            if (multbase(out, 32, sc, 32) != 32 || !hexeq(out, 32, kB3)) {
              printf("FAIL: [3]B did not match RFC 9496\n"); return 1;
            }
            /* The group law, anchored to those same published points. */
            if (padd(out, 32, b1, 32, b1, 32) != 32 || !hexeq(out, 32, kB2)) {
              printf("FAIL: B + B was not [2]B\n"); return 1;
            }
            if (psub(out, 32, b3, 32, b1, 32) != 32 || !hexeq(out, 32, kB2)) {
              printf("FAIL: [3]B - B was not [2]B\n"); return 1;
            }
            /* General scalarmult must agree with the base-point one. */
            memset(sc, 0, sizeof sc); sc[0] = 2;
            if (mult(out, 32, sc, 32, b1, 32) != 32 || !hexeq(out, 32, kB2)) {
              printf("FAIL: scalarmult(2, B) disagreed with scalarmult_base(2)\n");
              return 1;
            }
            /* The ABI 9 batch crossing must agree with the single one. */
            memcpy(pts, b1, 32); memcpy(pts + 32, b1, 32);
            rc = batch(out, 64, sc, 32, pts, 64);
            if (rc != 64 || !hexeq(out, 32, kB2) || !hexeq(out + 32, 32, kB2)) {
              printf("FAIL: batch scalarmult (rc=%d) disagreed with the single one\n", rc);
              return 1;
            }
            /* A good point is accepted and a bad one refused. */
            memset(bad, 0xFF, sizeof bad);
            if (valid(b1, 32) != 1 || valid(bad, 32) != 0) {
              printf("FAIL: is_valid_point accepted a bad encoding or refused a good one\n");
              return 1;
            }
            /* RFC 8439 A.2 #1: zero key, zero nonce, counter 0, 64 zero bytes
             * in, so the output IS the keystream; then the xor is its own
             * inverse and must come back to the zeros it started from. */
            memset(ckey, 0, sizeof ckey); memset(cnonce, 0, sizeof cnonce);
            memset(czero, 0, sizeof czero);
            rc = cxor(out, 64, ckey, 32, cnonce, 12, czero, 64);
            if (rc != 64 || !hexeq(out, 64,
                  "76b8e0ada0f13d90405d6ae55386bd28bdd219b8a08ded1aa836efcc8b770dc7"
                  "da41597c5157488d7724e03fb8d84a376a43b8f41518a11cc387b669b2ee6586")) {
              printf("FAIL: ChaCha20-IETF xor (rc=%d) did not give the RFC 8439"
                     " A.2 #1 keystream\n", rc);
              return 1;
            }
            if (cxor(cback, 64, ckey, 32, cnonce, 12, out, 64) != 64 ||
                memcmp(cback, czero, 64) != 0) {
              printf("FAIL: ChaCha20-IETF xor is not its own inverse\n"); return 1;
            }
            printf("  committed library executed OK (ABI %d, RFC 9496 [1..3]B,"
                   " group law, scalarmult, batch, point validation,"
                   " RFC 8439 A.2 #1 ChaCha20)\n", abi());
            dlclose(so);
            return 0;
          }
          DRIVER
          bits=""
          if [ "${{ matrix.multilib }}" = "true" ]; then bits="-m32"; fi
          gcc $bits -O1 -o /tmp/rdrive /tmp/rdrive.c -ldl
          file /tmp/rdrive "$lib"
          /tmp/rdrive "$(pwd)/$lib" "$want_abi"

      - name: Install libsodium via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install libsodium:${{ matrix.triplet }}

      # The MSVC dev environment is set up explicitly (rather than left to
      # CMake's detection, which fails on the current runner image), and the
      # matching msvc_arch gives a native x64 or x86 cl.exe.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure, build, test (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSODIUMXT_BUILD_TESTS=ON ${{ matrix.configure_args }}
          cmake --build build --config Release -j
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Configure, build, test (Windows / MSVC + vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DSODIUMXT_BUILD_TESTS=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Package the native library
        run: python tools/package-extension.py --build-dir build --platform-id ${{ matrix.platform }}

      - name: Upload native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodiumxt-${{ matrix.platform }}
          path: src/code/${{ matrix.platform }}/sodiumxt.${{ matrix.ext }}
          if-no-files-found: error
