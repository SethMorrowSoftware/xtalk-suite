# GENERATED by tools/sync-member-workflows.py
# from the suite's .github/workflows/native-enetxt.yml (https://github.com/SethMorrowSoftware/xtalk-suite).
#
# This is enetxt's native build matrix as its OWN repository runs it. Inside the
# suite monorepo this file is inert (GitHub Actions reads only the root
# .github/workflows/), and the root copy is the one that fires there; the two
# are held identical up to the monorepo-isms by the generator's --check in the
# suite's gate set, so the lanes, flags, runners and assertions here are the
# ones the suite runs, not a snapshot of them.
#
# What the generator removed, and why each removal is right for a standalone
# repository: the `paths:` filters (this repository IS the member, so every
# push is in scope), the `working-directory: enetxt` defaults (the checkout root
# is the member root here), and the `enetxt/` prefix on artifact paths.
#
# Do not edit this file by hand, here or in the suite: edit the root workflow
# in the suite and re-run `python3 tools/sync-member-workflows.py`. The
# suite's publisher (tools/publish-members.py) carries every change into the
# member's own repository; an edit made there directly is refused by the next
# publish until it is ported back into the suite.
name: native enetxt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded run is wasted runner time: keep only the newest per ref.
concurrency:
  group: native-enetxt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitize:
    name: full-stack ASan+UBSan (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build
      # ENETXT_SANITIZE is the member's own knob: a STRING, injected GLOBALLY
      # before FetchContent so the pinned ENet is instrumented too. Hand-rolled
      # per-build flags would leave the dependency bare.
      - name: Configure + build + test under sanitizers
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENETXT_BUILD_TESTS=ON \
            -DENETXT_SANITIZE=address
          cmake --build build-asan --parallel 4
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error

  build-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            platform_id: x86_64-linux
            acquire: linux64
            cmake_args: ""
          - name: linux-x86
            os: ubuntu-24.04
            platform_id: x86-linux
            acquire: linux32
            cmake_args: "-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32"
          - name: macos
            os: macos-15
            platform_id: universal-mac
            acquire: none
            # Both slices, not the runner's own arch: this lane stages its
            # artifact under the universal-mac name, and until 2026-08-23 it
            # built with no arch flag on an arm64-only runner - a THIN arm64
            # dylib wearing a universal label. Artifact-only, never committed,
            # but exactly the mislabel the suite installer refuses; the
            # release workflow's mac lane carries the same flag.
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - name: windows-x86_64
            os: windows-2025
            platform_id: x86_64-win32
            acquire: none
            cmake_args: "-A x64"
          - name: windows-x86
            os: windows-2025
            platform_id: x86-win32
            acquire: none
            cmake_args: "-A Win32"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (for package-extension.py)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Acquire toolchain (Linux x86_64)
        if: matrix.acquire == 'linux64'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build

      - name: Acquire 32-bit toolchain (Linux x86)
        if: matrix.acquire == 'linux32'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib cmake ninja-build

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENETXT_BUILD_TESTS=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --no-tests=error: ctest exits 0 on an EMPTY test set, so without this a
      # misconfigured lane reports green having run nothing (the suite lesson
      # that made tools/build-all.sh hollow for months).
      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Stage per-platform binary
        shell: bash
        run: |
          python3 tools/package-extension.py \
            --platform-id ${{ matrix.platform_id }} \
            --build-dir build || \
            echo "package-extension: nothing to stage."

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enetxt-${{ matrix.platform_id }}
          path: src/code/${{ matrix.platform_id }}/
          if-no-files-found: ignore
