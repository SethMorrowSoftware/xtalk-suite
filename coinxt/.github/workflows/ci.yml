name: CoinXT CI

# The automated safety net CoinXT gets. OXT is a GUI runtime with no headless way
# to compile or run .lcb / .livecodescript, so the script layer is covered by the
# static gates only; behaviour on a real engine is confirmed manually (CLAUDE.md).
# The NATIVE shim, by contrast, IS fully testable headless: the known-answer
# harness builds it from source and drives it through ctypes, and the ASan/UBSan
# self-test proves it memory-clean. Both run here on every push / PR.
#
# NOTE: this workflow is INERT in the xtalk-suite monorepo, for the same reason
# it was dormant when CoinXT was staged inside the OnionXT repository: GitHub
# only reads .github/ at the repo root. The split this note once promised
# ("goes live the moment CoinXT is split into its own repository") was
# superseded by the consolidation (README.md: the monorepo is the source of
# truth; MIGRATION.md is retained as history, not a plan). The live lane is the
# root native-coinxt.yml; this file is kept so the standalone mirror still
# carries CI when a member is worked on there in isolation.

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The independent implementation the secp256k1 vectors are checked
      # against. Both coin-kat.py and check-selftest-vectors.py treat it as
      # optional and SKIP without it - right for a contributor's machine, wrong
      # for CI, where a skip exits 0 exactly like a pass. The
      # COINXT_REQUIRE_CROSSCHECK below turns that skip into a failure, so
      # removing this step cannot silently downgrade either gate.
      - name: Install the independent crypto implementation
        run: pip install ecdsa

      - name: Static gate for the script layer (.lcb / .livecodescript)
        run: python3 tools/check-livecodescript.py

      - name: House-style gate for docs (.md)
        run: python3 tools/check-docs-style.py

      - name: Vendored-source integrity (trezor-crypto subset)
        run: cd native && sha256sum -c MANIFEST.sha256

      # These two run in the monorepo's suite-gates but were missing here, so a
      # developer working on CoinXT in isolation - the whole reason this file is
      # retained - was NOT getting them. The freshness check is the automated
      # half of suite rule 5: a shim that gained, lost, or renamed an export, or
      # bumped its ABI, without its committed library being refreshed in the same
      # change, is a load failure on a user's machine rather than a build failure
      # here.
      - name: Committed library still matches the shim (suite rule 5)
        run: python3 tools/check-binary-freshness.py

      - name: Committed binaries match src/code/MANIFEST.sha256
        run: cd src/code && sha256sum -c MANIFEST.sha256

      - name: Known-answer vectors (build the shim, drive it via ctypes)
        env:
          COINXT_REQUIRE_CROSSCHECK: "1"
        run: python3 tools/coin-kat.py --check

      # The OXT self-test carries its expected digests as hand-copied literals,
      # so they can drift from the shim and from the published answers. A
      # drifted expectation turns a real regression into a green run. Needs no
      # compiler, unlike the KAT step above.
      - name: The OXT self-test's vectors have not drifted
        env:
          COINXT_REQUIRE_CROSSCHECK: "1"
        run: python3 tools/check-selftest-vectors.py --check

      # The pure-script encoders, actually executed. OXT cannot run a
      # .livecodescript headlessly, so tools/lcs-interp.py interprets the subset
      # they are written in and drives the REAL file against the published
      # BIP-173 / BIP-350 / EIP-55 / RLP vectors, with the hashes supplied by the
      # real shim. It approximates the engine and does not replace the on-engine
      # pass; it catches the bug class that matters here, where a wrong alphabet
      # or an inverted checksum yields a valid-looking WRONG address.
      - name: The script encoders reproduce the published vectors
        run: python3 tools/check-script-vectors.py --check

      # The WALLET, one layer up, in two steps. The first drives the shipped
      # engine (examples/wallet-core.livecodescript) against an independent
      # oracle, twice - as written, and with `is` and `offset()` folded to the
      # engine's own case-insensitive default, which is the rule the
      # interpreter does not model and under which two real defects hid behind
      # a green run. The second BOOTS the shipped stack headlessly over
      # riptide's engine object model with the committed library underneath.
      # Both are slower than everything above them and run last for that
      # reason.
      - name: The wallet engine, against its oracle and under both case rules
        run: python3 tools/check-wallet-vectors.py --check

      - name: The wallet stack boots headlessly
        run: python3 tools/check-wallet-boot.py --check

      - name: ASan + UBSan native self-test
        run: sh native/build.sh asan
