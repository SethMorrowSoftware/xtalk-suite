# GENERATED by tools/sync-member-workflows.py
# from the suite's .github/workflows/native-box2dxt.yml (https://github.com/SethMorrowSoftware/xtalk-suite).
#
# This is Box2Dxt's native build matrix as its OWN repository runs it. Inside the
# suite monorepo this file is inert (GitHub Actions reads only the root
# .github/workflows/), and the root copy is the one that fires there; the two
# are held identical up to the monorepo-isms by the generator's --check in the
# suite's gate set, so the lanes, flags, runners and assertions here are the
# ones the suite runs, not a snapshot of them.
#
# What the generator removed, and why each removal is right for a standalone
# repository: the `paths:` filters (this repository IS the member, so every
# push is in scope), the `working-directory: box2dxt` defaults (the checkout root
# is the member root here), and the `box2dxt/` prefix on artifact paths.
#
# Do not edit this file by hand, here or in the suite: edit the root workflow
# in the suite and re-run `python3 tools/sync-member-workflows.py`. The
# suite's publisher (tools/publish-members.py) carries every change into the
# member's own repository; an edit made there directly is refused by the next
# publish until it is ported back into the suite.
name: native box2dxt

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-box2dxt-${{ github.ref }}
  cancel-in-progress: true

# The other five native lanes each carry this and this one did not (2026-08-17).
# Nothing here needs a write token - every lane uploads artifacts and commits
# nothing, which is this file's stated rule above - so the workflow should not
# be handed the default write scope on a push.
permissions:
  contents: read

jobs:
  # The instrumented lane. Box2D is a solver full of hand-rolled array
  # arithmetic and the shim hands it raw script-supplied indices, so the smoke
  # test's validity-guard and bad-handle cases are exactly where an off-by-one
  # would hide - and three separate places in the tree (the root CLAUDE.md,
  # this member's CLAUDE.md, tools/check-suite-coverage.py) cite
  # "smoke_test.c under ASan" as the ONLY thing covering the 376 raw b2*
  # exports, a claim that had no lane behind it until this job existed.
  #
  # WHY HAND-ROLLED FLAGS, when native-torrentxt.yml's lane says in as many
  # words to prefer the member's own knob: box2dxt has no BOX2DXT_SANITIZE
  # option, unlike its five siblings. The warning there is that hand-rolled
  # CMAKE_<LANG>_FLAGS instrument the COMPILE and leave the LINK bare, so this
  # sets the linker flags too - both EXE (the smoke test) and SHARED (the .so
  # it links against). Setting them on the configure line rather than per
  # target is deliberate and is the same reasoning enetxt's lane gives for its
  # global knob: CMAKE_C_FLAGS is in effect when FetchContent_MakeAvailable
  # creates Box2D's targets, so the vendored solver is instrumented as well.
  # Measured locally on gcc 13.3 before this landed - __asan_report_* appear in
  # _deps/box2d-build/src/libbox2d.a, libasan/libubsan are NEEDED by the smoke
  # binary, and ctest passes clean. A BOX2DXT_SANITIZE knob in the member's
  # CMakeLists is the better home for this and would let this block shrink to
  # the sibling shape; it is an open item, not something this file can fix.
  #
  # Box2D's SIMD default (AVX2 on x64) is deliberately LEFT ON here: the
  # release lanes below turn it off for portability, so leaving it alone is
  # what puts the vectorised solver paths - the ones with the array arithmetic
  # worth instrumenting - under the sanitizer at all.
  sanitize:
    name: full-stack ASan+UBSan (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain
        # g++ as well as gcc: the shim and Box2D are both C, but Box2D's own
        # project() enables CXX, so configure needs a working C++ compiler even
        # though it never compiles a .cpp here.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build
      - name: Configure + build + test under sanitizers
        # gcc, not clang: clang's ASan runtime is not on the runner image, the
        # same reason sodiumxt's lane pins CC.
        env:
          CC: gcc
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBOX2DXT_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --parallel 4
          # --no-tests=error: ctest exits 0 on an EMPTY test set, so without it
          # a lane that failed to register `smoke` reports green having run
          # nothing under the sanitizer.
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error

  # Linux binaries build inside a manylinux2014 container (CentOS 7, glibc
  # 2.17) so they load on virtually any Linux from 2013 onward. Checkout on
  # the host, `docker run` the build: actions/checkout's bundled Node won't
  # run against glibc 2.17 inside the container.
  build-linux:
    name: build & smoke-test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            image: quay.io/pypa/manylinux2014_x86_64
            cmake_args: -DBOX2D_AVX2=OFF
            asset: libbox2dxt-linux-x86_64.so
          - name: linux-i686
            image: quay.io/pypa/manylinux2014_i686
            cmake_args: -DBOX2D_DISABLE_SIMD=ON
            asset: libbox2dxt-linux-i686.so
    steps:
      - uses: actions/checkout@v4
      - name: Build & smoke-test in ${{ matrix.image }} (glibc 2.17)
        run: |
          docker run --rm -v "$PWD":/io -w /io "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              if ! command -v cmake >/dev/null 2>&1; then
                PYBIN="$(ls -d /opt/python/cp31*-cp31*/bin 2>/dev/null | tail -1)"
                "$PYBIN/pip" install --quiet cmake ninja
                export PATH="$PYBIN:$PATH"
              fi
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBOX2DXT_BUILD_TESTS=ON ${{ matrix.cmake_args }}
              cmake --build build --config Release
              ctest --test-dir build --output-on-failure
              mkdir -p dist
              cp "$(find build -maxdepth 2 -name libbox2dxt.so | head -n 1)" "dist/${{ matrix.asset }}"
            '
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # macOS + Windows build natively on their runners.
  build-native:
    name: build & smoke-test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            # Intel + Apple Silicon in one dylib; AVX2 off keeps the x86
            # slice portable. Quoted so bash does not split on the ';'.
            # (CORRECTED 2026-08-23: a note here claimed box2dxt was "the ONE
            # member whose universal build works on a plain macos runner".
            # Measured against the tree instead: native-sodiumxt.yml has
            # carried the same CMAKE_OSX_ARCHITECTURES recipe - with the
            # multi-arch CFLAGS reaching its libsodium sub-build - and
            # release-binaries.yml now runs universal mac lanes for four
            # members. What the old note got right is that the naive flagless
            # build on an arm64 runner emits a thin dylib; the flag is the
            # whole difference.)
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DBOX2D_AVX2=OFF'
            lib: libbox2dxt.dylib
            asset: libbox2dxt-macos-universal.dylib
          - name: windows-x64
            os: windows-latest
            cmake_args: -A x64 -DBOX2D_AVX2=OFF
            lib: box2dxt.dll
            asset: box2dxt-windows-x64.dll
          - name: windows-x86
            os: windows-latest
            # 32-bit MSVC: scalar Box2D so the DLL needs no specific x86
            # CPU features.
            cmake_args: -A Win32 -DBOX2D_DISABLE_SIMD=ON
            lib: box2dxt.dll
            asset: box2dxt-windows-x86.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBOX2DXT_BUILD_TESTS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage library
        shell: bash
        run: |
          mkdir -p dist
          # MSVC drops the DLL in build/Release/; single-config generators
          # use build/.
          src="$(find build -maxdepth 2 -name '${{ matrix.lib }}' | head -n 1)"
          test -n "$src" || { echo "could not find ${{ matrix.lib }} under build/"; exit 1; }
          cp "$src" "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
