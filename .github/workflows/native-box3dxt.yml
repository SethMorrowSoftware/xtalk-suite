# box3dxt's native build matrix, at the ROOT of the monorepo (GitHub runs only
# root workflows here; member workflows are generated for published repos).
#
# WHAT IT DOES NOT DO: it does not commit binaries. Each lane uploads its
# library as an ARTIFACT; committed binaries come from the suite's manual
# release-binaries.yml dispatch (suite rule 5).
#
# FIVE JOBS, each the proof of one sentence in the member's README:
#   sanitize      the smoke test and the random-call test under ASan/UBSan, in
#                 a Debug build so Box3D's own asserts are compiled in;
#   engine        the binding compiled with OXT-Beyond's lc-compile -Werror and
#                 tests/engine-selftest.lc RUN on its headless server engine,
#                 over the library this job built, then the member's gates;
#   build-matrix  every desktop platform the release workflow builds, tested;
#   web           the wasm32-emscripten archive, its tests run by node;
#   android       the suite's tools/build-android.sh for all four ABIs, the
#                 tests run on the Android 5.0 emulator for the two x86 ones.
#                 (Only in the suite: the recipe is the suite's, so in the
#                 member's own repository this job is SKIPPED, visibly.)
name: native box3dxt

on:
  pull_request:
    paths:
      - "box3dxt/**"
      - "!box3dxt/docs/**"
      - "!box3dxt/**/*.md"
      - "box3dxt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-box3dxt.yml"
  push:
    branches: [main]
    paths:
      - "box3dxt/**"
      - "!box3dxt/docs/**"
      - "!box3dxt/**/*.md"
      - "box3dxt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-box3dxt.yml"
  workflow_dispatch:

concurrency:
  group: native-box3dxt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"
  # The OXT-Beyond release whose lc-compile and server engine the `engine`
  # job uses: lce-packages.yml's pins, so one engine build compiles and runs
  # every member's modules. Bump the two files together.
  OXT_BEYOND_REPO: SethMorrowSoftware/OpenXTalk-Beyond
  OXT_BEYOND_TAG: v0.2.7-rc.6
  OXT_BEYOND_BINARIES: OXT-Beyond-0.2.7-rc.6-linux-x86_64-binaries.tar.xz
  OXT_BEYOND_BINARIES_SHA256: 12504ee02cbf26c59f218263724790853b50993ebdda02546df66bcf6525add8
  # The Emscripten release the `web` job installs (the one the archive was
  # first built and tested with, 2026-11-20).
  EMSDK_VERSION: "6.0.12"

defaults:
  run:
    working-directory: box3dxt

jobs:
  sanitize:
    name: ASan+UBSan, Box3D's asserts on (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake ninja-build
      # Debug, not RelWithDebInfo as the siblings use: both compile Box3D's
      # asserts in, and Debug is the slower, stricter of the two. The shim
      # counts an assert instead of aborting, and both tests fail on a count.
      - name: Configure + build + test under sanitizers
        env:
          CC: gcc
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBOX3DXT_BUILD_TESTS=ON \
            -DBOX3DXT_SANITIZE=address
          cmake --build build-asan --parallel 4
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error
      # ctest's fuzz run is three seeds. More seeds here, in the optimised
      # sanitizer build (asserts still on), where a seed costs seconds.
      - name: A longer random-call run
        env:
          CC: gcc
        run: |
          cmake -S . -B build-asanrel \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBOX3DXT_BUILD_TESTS=ON \
            -DBOX3DXT_SANITIZE=address
          cmake --build build-asanrel --parallel 4 --target box3dxt_fuzz
          for seed in $(seq 4 40); do
            ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            timeout 600 ./build-asanrel/box3dxt_fuzz "$seed" 30000 | tail -n 1
          done

  engine:
    name: the binding on OXT-Beyond's server engine (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake ninja-build
      - name: Release build + tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBOX3DXT_BUILD_TESTS=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure --no-tests=error
      # lc-compile, modules/lci and the server engine from the release's
      # binaries archive, checked against its pin (the folder is renamed from
      # linux-x86_64-bin: a folder of that name in the engine's path makes
      # the engine look for a source checkout).
      - name: Fetch OXT-Beyond's tools
        run: |
          oxt="$RUNNER_TEMP/oxt"
          mkdir -p "$oxt"
          base="https://github.com/$OXT_BEYOND_REPO/releases/download/$OXT_BEYOND_TAG"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/bin.tar.xz" "$base/$OXT_BEYOND_BINARIES"
          echo "$OXT_BEYOND_BINARIES_SHA256  $RUNNER_TEMP/bin.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/bin.tar.xz" -C "$oxt" --wildcards \
            'linux-x86_64-bin/lc-compile' 'linux-x86_64-bin/server-community' \
            'linux-x86_64-bin/server-revzip.so' 'linux-x86_64-bin/server-revxml.so' \
            'linux-x86_64-bin/modules/lci/*'
          mv "$oxt/linux-x86_64-bin" "$oxt/engine"
          rm "$RUNNER_TEMP/bin.tar.xz"
      # -Werror, as the IDE's Extension Builder runs it: a warning here is a
      # module nobody can install.
      - name: Compile the binding (lc-compile -Werror)
        run: |
          mkdir -p "$RUNNER_TEMP/lcb"
          "$RUNNER_TEMP/oxt/engine/lc-compile" -Werror \
            --modulepath "$RUNNER_TEMP/oxt/engine/modules/lci" \
            --modulepath "$RUNNER_TEMP/lcb" \
            --output "$RUNNER_TEMP/lcb/box3dxt.lcm" src/box3dxt.lcb
      # The engine loads the module, binds every foreign handler against the
      # library built above and runs the test. Green needs BOTH an exit of 0
      # and a SUMMARY line with no failure: an engine that printed nothing
      # must not read as a pass.
      - name: Run tests/engine-selftest.lc on the engine
        run: |
          set -o pipefail
          "$RUNNER_TEMP/oxt/engine/server-community" tests/engine-selftest.lc \
            "$RUNNER_TEMP/lcb/box3dxt.lcm" "$PWD/build/box3dxt" "$PWD/tests/models/teapot.obj" | tee "$RUNNER_TEMP/engine.log"
          grep -E '^SUMMARY [1-9][0-9]* 0$' "$RUNNER_TEMP/engine.log"
          {
            echo "Engine self-test: $(grep '^SUMMARY ' "$RUNNER_TEMP/engine.log" | awk '{print $2 " passed, " $3 " failed"}') on OXT-Beyond $OXT_BEYOND_TAG (Linux x86-64)."
            grep '^INFO ' "$RUNNER_TEMP/engine.log" | sed 's/^INFO /- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The member's gates
        run: bash tools/run-gates.sh

  build-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two 64-bit Linux rows build where the release rows do: the
          # manylinux_2_28 image (glibc 2.28, its own gcc), so the compiler
          # and C library a release dispatch will use are the ones tested
          # here on every change.
          - name: linux-x86_64
            os: ubuntu-24.04
            platform_id: x86_64-linux
            container: quay.io/pypa/manylinux_2_28_x86_64
            acquire: manylinux
            cmake_args: ""
          # The member's CMake adds -msse2 -mfpmath=sse on 32-bit x86 (Box3D's
          # determinism test fails on x87 arithmetic).
          - name: linux-x86
            os: ubuntu-24.04
            platform_id: x86-linux
            acquire: linux32
            cmake_args: "-DCMAKE_C_FLAGS=-m32"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform_id: arm64-linux
            container: quay.io/pypa/manylinux_2_28_aarch64
            acquire: manylinux
            cmake_args: ""
          # Box3D has no dependency, so the universal build is the plain
          # two-arch flag, as box2dxt's and enetxt's are.
          - name: macos-universal
            os: macos-15
            platform_id: universal-mac
            acquire: none
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - name: windows-x86_64
            os: windows-2025
            platform_id: x86_64-win32
            acquire: none
            cmake_args: "-A x64"
          - name: windows-x86
            os: windows-2025
            platform_id: x86-win32
            acquire: none
            cmake_args: "-A Win32"
    runs-on: ${{ matrix.os }}
    # Empty for every row that does not set one, which Actions treats as "no
    # container".
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      # release-binaries.yml's step: cmake and ninja from the image's CPython.
      - name: Provision build tools (manylinux rows)
        if: matrix.acquire == 'manylinux'
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          PYBIN=/opt/python/cp312-cp312/bin
          "$PYBIN/python3" -m pip install --quiet cmake ninja
          ln -sf "$PYBIN/python3" /usr/local/bin/python3
          ln -sf "$PYBIN/cmake"   /usr/local/bin/cmake
          ln -sf "$PYBIN/ctest"   /usr/local/bin/ctest
          ln -sf "$PYBIN/ninja"   /usr/local/bin/ninja

      - name: Acquire 32-bit toolchain (Linux x86)
        if: matrix.acquire == 'linux32'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib cmake ninja-build

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOX3DXT_BUILD_TESTS=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      # ctest ran the arm64 slice. The x86_64 slice is EXECUTED too, under
      # Rosetta, each test binary launched through `arch` itself (a fat test
      # spawned from an arm64 parent would run arm64 again).
      - name: Test the x86_64 slice under Rosetta (mac)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          sudo softwareupdate --install-rosetta --agree-to-license || true
          lipo -archs build/box3dxt.dylib
          lipo -archs build/box3dxt.dylib | grep -q x86_64
          lipo -archs build/box3dxt.dylib | grep -q arm64
          arch -x86_64 build/box3dxt_smoke | tail -n 1
          arch -x86_64 build/box3dxt_fuzz | tail -n 1

      - name: Stage the library
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform_id }}"
          for f in build/box3dxt.so build/box3dxt.dylib build/Release/box3dxt.dll; do
            if [ -f "$f" ]; then cp "$f" "dist/${{ matrix.platform_id }}/"; fi
          done
          test -n "$(ls "dist/${{ matrix.platform_id }}/")"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box3dxt-${{ matrix.platform_id }}
          path: box3dxt/dist/${{ matrix.platform_id }}/
          if-no-files-found: ignore

  web:
    name: wasm32-emscripten (the archive, tested under node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Emscripten
        run: |
          git clone --quiet --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION" > "$RUNNER_TEMP/emsdk-install.log" 2>&1 ||
            { tail -40 "$RUNNER_TEMP/emsdk-install.log"; exit 1; }
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION" > /dev/null
      # BOX3DXT_PLACE_IN_SRC=OFF: a CI build places nothing in the tree.
      - name: Configure + build + test
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" > /dev/null 2>&1
          emcc --version | head -n 1
          emcmake cmake -S . -B build-web -DBOX3DXT_BUILD_TESTS=ON -DBOX3DXT_PLACE_IN_SRC=OFF
          cmake --build build-web --parallel 4
          ctest --test-dir build-web --output-on-failure --no-tests=error
          mkdir -p dist/wasm32-emscripten
          cp build-web/box3dxt.a dist/wasm32-emscripten/
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: box3dxt-wasm32-emscripten
          path: box3dxt/dist/wasm32-emscripten/
          if-no-files-found: error

  # The suite's own Android recipe, run for this member alone, so a change
  # here is proven for Android BEFORE a release dispatch builds it beside the
  # other members (one red row there discards every member's libraries). The
  # steps are release-binaries.yml's `android` job's, for one member.
  android:
    name: android ${{ matrix.platform_id }}
    if: github.repository == 'SethMorrowSoftware/xtalk-suite'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: arm64-android
          - platform_id: armv7-android
          - platform_id: x86_64-android
            emulator: "1"
          - platform_id: x86-android
            emulator: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up the pinned NDK
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ndk=$(bash tools/build-android.sh --pins | sed -n 's/^ndk //p')
          [ -n "$ndk" ] || { echo "::error::build-android.sh --pins names no NDK"; exit 1; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -d "$sdk" ] || { echo "::error::no Android SDK on the runner (ANDROID_HOME)"; exit 1; }
          if [ ! -f "$sdk/ndk/$ndk/source.properties" ]; then
            sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
            (yes || true) | "$sm" --licenses > /dev/null
            "$sm" --install "ndk;$ndk" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 ||
              { tail -40 "$RUNNER_TEMP/sdkmanager.log"; exit 1; }
          fi
          sed -n 's/^Pkg\.Revision *= *//p' "$sdk/ndk/$ndk/source.properties"
          command -v ninja > /dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_NDK_HOME=$sdk/ndk/$ndk"
            echo "ADB=$sdk/platform-tools/adb"
            echo "XTALK_ANDROID_WORK=$RUNNER_TEMP/android-work"
          } >> "$GITHUB_ENV"
      - name: Boot the Android 5.0 emulator (the x86 ABIs)
        if: matrix.emulator
        shell: bash
        working-directory: ${{ github.workspace }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          bash tools/android-emulator.sh start | tee "$RUNNER_TEMP/emulator.txt"
          serial=$(sed -n 's/^serial //p' "$RUNNER_TEMP/emulator.txt" | tail -1)
          [ -n "$serial" ] || { echo "::error::android-emulator.sh named no serial"; exit 1; }
          echo "XTALK_ANDROID_SERIAL=$serial" >> "$GITHUB_ENV"
      # Built is not run: the script's last line says which, and an emulator
      # row whose tests did not run is a failed row.
      - name: Build (and run the tests on the emulator rows)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash tools/build-android.sh box3dxt "${{ matrix.platform_id }}" 2>&1 | tee "$RUNNER_TEMP/android.log"
          last=$(tail -n 1 "$RUNNER_TEMP/android.log")
          echo "- ${last}" | sed 's/== build-android: //; s/ ==$//' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ matrix.emulator }}" ]; then
            echo "$last" | grep -q 'tests RUN on ' || { echo "::error::the tests did not run on the emulator"; exit 1; }
          fi
