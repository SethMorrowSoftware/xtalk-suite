# The suite's root CI. In a monorepo, GitHub Actions runs ONLY the workflows in
# the repository-root .github/workflows/ - each member's own .github/ is inert
# here. This workflow runs the fast, deterministic gates that guard every member
# on every push: the LiveCodeScript static checker, the docs house-style gates,
# every golden-vector suite (wire formats, BEP44, the file server), the
# record-schema registry checks, the known-answer harnesses (onionxt pure
# python; coinxt compiles its small shim in a temp dir), the generated-
# standalone freshness check, and the committed-binary / vendored-source
# MANIFEST.sha256 integrity checks. No engine needed; the only compiler use is
# coinxt's tiny KAT build, so the job stays fast.
#
# Heavy native matrix builds (libtorrent, libdatachannel, libsodium, ENet across
# five platforms) remain defined in each member's own workflow files for when a
# member is developed in isolation; porting them into a root build matrix is a
# tracked follow-up, kept out of the always-on gate so this job stays quick.
name: suite gates

on:
  push:
  pull_request:

jobs:
  gates:
    name: static gates + golden vectors (all members)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # coinxt's curve vectors are cross-checked against an INDEPENDENT
      # implementation, which is the project rule ("cross-checked against an
      # independent implementation before pinning") enforced continuously
      # rather than once. Both tools treat `ecdsa` as optional and SKIP without
      # it, which is right for a contributor and wrong here: a skip and a pass
      # both exit 0. COINXT_REQUIRE_CROSSCHECK turns the skip into a failure, so
      # deleting this install can never quietly downgrade the gate to the weaker
      # same-repo comparison.
      - name: Install the independent crypto implementation coinxt checks against
        run: pip install ecdsa

      - name: Run every member's static gates, golden tests, KATs, and manifests
        env:
          COINXT_REQUIRE_CROSSCHECK: "1"
        run: bash tools/build-all.sh --gates
