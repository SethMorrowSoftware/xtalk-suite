# The suite's root CI. In a monorepo, GitHub Actions runs ONLY the workflows in
# the repository-root .github/workflows/ - each member's own .github/ is inert
# here. This workflow runs the fast, deterministic gates that guard every member
# on every push: the LiveCodeScript static checker, the docs house-style gates,
# every golden-vector suite (wire formats, BEP44, the file server), the
# record-schema registry checks, the known-answer harnesses (onionxt pure
# python; coinxt compiles its small shim in a temp dir), the generated-
# standalone freshness check, and the committed-binary / vendored-source
# MANIFEST.sha256 integrity checks. No engine needed; the only compiler use is
# coinxt's tiny KAT build, so the job stays fast.
#
# Heavy native matrix builds (libtorrent, libdatachannel, libsodium, ENet,
# Box2D, trezor-crypto, across five platforms) run from the ROOT
# native-<member>.yml workflows beside this file, one per member with native
# code, `paths:`-scoped so only the touched member builds. This paragraph once
# called that port a tracked follow-up; it shipped as those six root lanes.
# The matrix copies inside each member's own .github/ are inert here (the
# root-only rule above) and are kept only for developing a member in isolation
# against its standalone mirror. The matrices stay out of this always-on job
# so it stays quick.
name: suite gates

on:
  push:
  pull_request:
  # So the heavy cross-member job below can be forced without pushing a commit
  # that touches one of its scoped paths. It also fires the fast gates job,
  # which is harmless.
  workflow_dispatch:

# Nothing here writes: both jobs read the tree, run gates, and upload
# artifacts. Same reasoning as the native-<member>.yml lanes beside this file.
permissions:
  contents: read

jobs:
  gates:
    name: static gates + golden vectors (all members)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # coinxt's curve vectors are cross-checked against an INDEPENDENT
      # implementation, which is the project rule ("cross-checked against an
      # independent implementation before pinning") enforced continuously
      # rather than once. Both tools treat `ecdsa` as optional and SKIP without
      # it, which is right for a contributor and wrong here: a skip and a pass
      # both exit 0. COINXT_REQUIRE_CROSSCHECK turns the skip into a failure, so
      # deleting this install can never quietly downgrade the gate to the weaker
      # same-repo comparison.
      - name: Install the independent crypto implementation coinxt checks against
        run: pip install ecdsa

      - name: Run every member's static gates, golden tests, KATs, and manifests
        env:
          COINXT_REQUIRE_CROSSCHECK: "1"
        run: bash tools/build-all.sh --gates

      # The pasteable harness, as a download.
      #
      # It is NOT built here - build-all.sh --gates above ran
      # `build-suite-selftest.py --check`, which fails if the committed file is
      # not what the sources produce. So the file in the tree is already the
      # right one, and this step just makes it reachable without a clone: open
      # the run, download, paste into a stack script. Generating it here instead
      # would be strictly worse, because then the artifact and the repository
      # could differ and only the artifact would be current.
      #
      # The coverage report rides along because the honest question about a
      # self-test is not "did it pass" but "what did it not touch", and the
      # answer should be one click from the harness itself rather than something
      # you have to know to go and run.
      - name: Write the coverage report next to the harness
        run: |
          python3 tools/check-suite-coverage.py > suite-selftest-coverage.txt
          cat suite-selftest-coverage.txt

      - name: Upload the pasteable suite self-test
        uses: actions/upload-artifact@v4
        with:
          name: suite-selftest
          path: |
            tests/suite-selftest.livecodescript
            suite-selftest-coverage.txt
            docs/OXT-PASS-RUNBOOK.md
          if-no-files-found: error

  # --- the cross-member invariants, actually executed ------------------------
  #
  # WHY A SECOND JOB. tests/cross-member-test.py settles the suite's four
  # marquee cross-member claims natively - one seed giving both members the
  # same ed25519 identity, the two secret-key spellings, a libsodium signature
  # libtorrent verifies, the shared 60000-byte budget. Until 2026-08-17 it ran
  # in NO lane: its only caller is tools/build-all.sh, below that script's
  # `--gates` early exit, and every CI invocation passes --gates. It drives the
  # built .so files, so it cannot ride the gates job above - that job has no
  # compiler beyond coinxt's tiny KAT build, and keeping it that way is what
  # makes it fast enough to run on every push.
  #
  # WHY THE WHOLE WALKER rather than a two-member build spelled out here: the
  # walker is what produces the artifacts this test drives, at the paths it
  # looks for them. Reimplementing "configure, build and test sodiumxt and
  # torrentxt" in YAML would be a second copy of build-all.sh's build logic
  # that drifts from the first - the same reason release-binaries.yml runs
  # tools/install-release-binaries.py instead of reimplementing it. As a
  # by-product this is also the only lane that proves the full walk still
  # works end to end; nothing else runs it.
  #
  # WHY IT IS SCOPED, AND SAID PLAINLY: this is expensive. The full walk builds
  # libsodium (ExternalProject), libtorrent v2.0.11 and libdatachannel and ENet
  # and Box2D (all FetchContent, all from source), then coinxt's ASan
  # self-test. That is tens of minutes, and running it on every push to every
  # branch would make the fast gates job pointless. So the `scope` job below
  # decides from the changed files whether this run can possibly affect the
  # invariants, and this job runs only when it can. Per-member build coverage
  # is NOT this lane's job and is not what the scope list is for - each member
  # has its own paths-scoped native-<member>.yml for that.
  scope:
    name: does this change touch the cross-member invariants?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the diff below needs the base commit, and the
          # default shallow clone does not have it.
          fetch-depth: 0
      - id: decide
        name: Decide from the changed paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # FAIL OPEN. A branch's first push sends an all-zero `before`, a
          # force push leaves one we cannot reach, and workflow_dispatch sends
          # none at all. In every case we cannot tell what changed - and the
          # two errors are not symmetric: a redundant run costs runner minutes,
          # a missed run silently restores the exact hole this job was added to
          # close. So an unknown base RUNS the job.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base unknown or unreachable ('$base') - running the lane"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "changed files:"; echo "$changed"
          # The paths the invariants actually depend on: the two shims they
          # drive, the two headers the budget leg reads (by #define, so a value
          # edit in either one is precisely what that leg exists to catch), the
          # test itself, the walker that runs it, and this file.
          if printf '%s\n' "$changed" | grep -qE '^(sodiumxt/|torrentxt/|enetxt/src/enx_abi\.h$|datachannelxt/src/dcx_abi\.h$|tests/cross-member-test\.py$|tools/build-all\.sh$|\.github/workflows/suite-gates\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  cross-member:
    name: full build + the cross-member invariants (native)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Generous: five source-built dependencies. A hang should still end the
    # run rather than sit on a runner for six hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The union of what the green per-member Linux lanes install: g++/cmake/
      # ninja for everyone, OpenSSL and zlib and Boost headers for torrentxt's
      # and datachannelxt's source builds, gcc for coinxt's ASan self-test.
      - name: Acquire the toolchain every member's Linux build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build \
                                  libboost-dev libssl-dev zlib1g-dev

      # The full walk runs the gate set too, so it must not be a WEAKER gate
      # run than the fast job above: same env, same optional dependency.
      - name: Install the independent crypto implementation coinxt checks against
        run: pip install ecdsa

      # CROSSMEMBER_REQUIRE_ALL is why this job is worth its runner minutes.
      # Without it, a lane whose build silently produced no sodiumxt.so would
      # print "SKIP the ed25519 and BEP44 checks" and exit 0 - green, having
      # measured two #defines. With it the skip is a failure, so this job can
      # only pass by actually settling the invariants. Same shape and same
      # reasoning as COINXT_REQUIRE_CROSSCHECK above.
      - name: Full walk - build every member, then the cross-member invariants
        env:
          COINXT_REQUIRE_CROSSCHECK: "1"
          CROSSMEMBER_REQUIRE_ALL: "1"
        run: bash tools/build-all.sh
