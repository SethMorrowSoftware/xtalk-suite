# oscxt's native build matrix, at the ROOT of the monorepo (GitHub runs only
# root workflows here; member workflows are generated for published repos).
#
# WHAT IT DOES NOT DO: it does not commit binaries. Each lane uploads its
# library as an ARTIFACT; committed binaries come from the suite's manual
# release-binaries.yml dispatch (suite rule 5).
#
# FOUR JOBS, each the proof of one sentence in the member's README:
#   sanitize      the smoke, vectors and fuzz tests under ASan/UBSan, then
#                 the deterministic fuzzer for 40 million datagrams: osc_parse
#                 eats untrusted network bytes, and ShowControl's fuzzer once
#                 found a remote out-of-bounds read in one 72-byte datagram;
#   libfuzzer     coverage-guided libFuzzer (clang) on the same entry point,
#                 seeded from the shared vectors, for three minutes;
#   engine        on Linux, Windows and macOS: the library built and tested,
#                 then the binding compiled by OXT-Beyond's lc-compile -Werror
#                 and RUN under lc-run, and the Script layer run in the
#                 standalone engine with -ui (real UDP, the interop peer,
#                 the shipped self-test), all with OSCXT_REQUIRE_ALL so a
#                 suite that cannot run fails instead of skipping. The Windows
#                 and macOS rows' libraries are the artifacts for those ids;
#   build-matrix  the other platform ids the release workflow builds, tested:
#                 the 64-bit Linux rows in the manylinux_2_28 image the
#                 release rows use, 32-bit Linux and 32-bit Windows.
name: native oscxt

on:
  pull_request:
    paths:
      - "oscxt/**"
      - "!oscxt/docs/**"
      - "!oscxt/**/*.md"
      - "oscxt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-oscxt.yml"
  push:
    branches: [main]
    paths:
      - "oscxt/**"
      - "!oscxt/docs/**"
      - "!oscxt/**/*.md"
      - "oscxt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-oscxt.yml"
  workflow_dispatch:

concurrency:
  group: native-oscxt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"
  # The OXT-Beyond release whose tools and engines the `engine` job runs:
  # the release lce-packages.yml and the other native lanes pin, so one
  # engine build compiles and runs every member's modules. Each archive's
  # SHA-256 is pinned in the matrix row that downloads it (the release's own
  # digests, read 2026-11-21).
  OXT_BEYOND_REPO: SethMorrowSoftware/OpenXTalk-Beyond
  OXT_BEYOND_TAG: v0.2.7-rc.6

defaults:
  run:
    working-directory: oscxt

jobs:
  sanitize:
    name: ASan+UBSan + 40M fuzz inputs (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake ninja-build
      - name: Configure + build + test under sanitizers
        env:
          CC: gcc
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOSCXT_BUILD_TESTS=ON \
            -DOSCXT_SANITIZE=address
          cmake --build build-asan
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error
      # ctest's fuzz run is 100,000 datagrams. Eight more seeds of five
      # million each here, where they cost about ten seconds a seed. The
      # fuzzer is deterministic: a failure names its seed, and
      # OSC_FUZZ_DUMP_AT=N writes iteration N's input for --replay.
      - name: The deterministic fuzzer, 40 million datagrams
        run: |
          for seed in $(seq 2 9); do
            ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            timeout 900 ./build-asan/osc_fuzz 5000000 "$seed" | tail -n 1
          done

  libfuzzer:
    name: libFuzzer on osc_parse (ASan+UBSan, 3 minutes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the coverage-guided fuzzer
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -DOSCXT_LIBFUZZER -D_DEFAULT_SOURCE \
            -Isrc -Isrc/third_party/tinyosc -Itests \
            src/osc_shim.c src/third_party/tinyosc/tinyosc.c tests/fuzz/osc_fuzz.c \
            -o "$RUNNER_TEMP/osc_libfuzzer"
      - name: Seed it from the shared vectors
        run: python3 tools/gen_vectors.py --corpus "$RUNNER_TEMP/fuzz-corpus"
      - name: Fuzz for three minutes
        run: |
          mkdir -p fuzz-artifacts
          "$RUNNER_TEMP/osc_libfuzzer" -max_total_time=180 -print_final_stats=1 \
            -max_len=4096 -artifact_prefix=fuzz-artifacts/ "$RUNNER_TEMP/fuzz-corpus"
      # A crash file replays with `osc_fuzz --replay FILE` (tests/fuzz/osc_fuzz.c).
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oscxt-fuzz-crashes
          path: oscxt/fuzz-artifacts/
          if-no-files-found: ignore

  engine:
    name: engine ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            cmake_args: ""
            oxt: OXT-Beyond-0.2.7-rc.6-linux-x86_64-binaries.tar.xz
            oxt_sha256: 12504ee02cbf26c59f218263724790853b50993ebdda02546df66bcf6525add8
            artifact: ""
          - name: windows-x86_64
            os: windows-2025
            cmake_args: "-A x64"
            oxt: OXT-Beyond-0.2.7-rc.6-win-x86_64-binaries.zip
            oxt_sha256: 49607dd4bb15648550bf31a5de652cc9cf0fbf49632e63bf2cc5612fc190296b
            artifact: x86_64-win32
          # The engine archive is universal; the library is built universal
          # too, and its x86_64 slice is run under Rosetta below.
          - name: macos-universal
            os: macos-15
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            oxt: OXT-Beyond-0.2.7-rc.6-mac-universal-binaries.tar.xz
            oxt_sha256: 7f043df59a2540c6b8c7d8a96d649793af975d96826fec84d052b12726c872d7
            artifact: universal-mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The standalone engine's core libraries (OXT-Beyond's
      # Installer/linux/libraries.txt); -ui needs no X display.
      - name: Engine runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0t64 libfontconfig1 libfreetype6

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOSCXT_BUILD_TESTS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      # ctest ran the arm64 slice. The x86_64 slice is EXECUTED too, each
      # registered test launched through `arch` itself (a fat test spawned
      # from an arm64 parent would run arm64 again).
      - name: Test the x86_64 slice under Rosetta (mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo softwareupdate --install-rosetta --agree-to-license || true
          lipo -archs build/oscxt.dylib | grep -q x86_64
          lipo -archs build/oscxt.dylib | grep -q arm64
          ctest --test-dir build --show-only=json-v1 > "$RUNNER_TEMP/ctest.json"
          python - "$RUNNER_TEMP/ctest.json" <<'PYEOF'
          import json, subprocess, sys
          tests = json.load(open(sys.argv[1]))["tests"]
          if not tests:
              sys.exit("no tests registered: nothing proves the x86_64 slice")
          for t in tests:
              print("x86_64:", t["name"], flush=True)
              subprocess.run(["arch", "-x86_64"] + t["command"], check=True,
                             cwd=next((p["value"] for p in t.get("properties", [])
                                       if p["name"] == "WORKING_DIRECTORY"), None))
          print("x86_64 slice: %d test(s) passed under Rosetta" % len(tests))
          PYEOF

      # lc-compile, lc-run, modules/lci and the standalone engine from the
      # release's binaries archive, checked against its pin. The Linux
      # folder is renamed from linux-x86_64-bin: a folder of that name in
      # the engine's path makes the engine look for a source checkout.
      - name: Fetch OXT-Beyond's engine and tools
        shell: bash
        run: |
          set -euo pipefail
          oxt="$RUNNER_TEMP/oxt"
          mkdir -p "$oxt"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/oxt-archive" \
            "https://github.com/$OXT_BEYOND_REPO/releases/download/$OXT_BEYOND_TAG/${{ matrix.oxt }}"
          have=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$RUNNER_TEMP/oxt-archive")
          if [ "$have" != "${{ matrix.oxt_sha256 }}" ]; then
            echo "::error::${{ matrix.oxt }} has SHA-256 $have, pinned ${{ matrix.oxt_sha256 }}"
            exit 1
          fi
          case "${{ matrix.oxt }}" in
            *.zip) python -m zipfile -e "$RUNNER_TEMP/oxt-archive" "$oxt" ;;
            *)     tar -xJf "$RUNNER_TEMP/oxt-archive" -C "$oxt" ;;
          esac
          rm "$RUNNER_TEMP/oxt-archive"
          if [ -d "$oxt/linux-x86_64-bin" ]; then mv "$oxt/linux-x86_64-bin" "$oxt/engine"; fi
          lcc=$(find "$oxt" -maxdepth 2 -type f \( -name lc-compile -o -name lc-compile.exe \) | head -n 1)
          [ -n "$lcc" ] || { echo "::error::no lc-compile in ${{ matrix.oxt }}"; exit 1; }
          bin=$(dirname "$lcc")
          chmod +x "$bin"/lc-compile* "$bin"/lc-run* 2>/dev/null || true
          echo "OXT_BIN=$bin" >> "$GITHUB_ENV"
          echo "toolchain: $bin"

      # -Werror, as the IDE's Extension Builder compiles; every public Test*
      # handler in its own lc-run process. The floor guards a run that
      # collapsed to a few assertions (318 on Linux, 2026-11-21).
      - name: The binding under lc-run (tests/lcb)
        shell: bash
        env:
          OSCXT_REQUIRE_ALL: "1"
        run: python tools/run-lcb-tests.py --oxt-bin "$OXT_BIN" --build-dir build --min-assertions 300 --tap-out "$RUNNER_TEMP/lcb-tests.tap"

      # The Script layer in the standalone engine with -ui: the boundary, the
      # helpers, the shipped self-test, real UDP through the engine's own
      # sockets and interop with the independent peer (tools/sim/). 112
      # assertions on Linux, 2026-11-21.
      - name: The Script layer in the engine (tests/lcs)
        shell: bash
        env:
          OSCXT_REQUIRE_ALL: "1"
        run: python tools/run-lcs-tests.py --oxt-bin "$OXT_BIN" --build-dir build --min-assertions 100 -v

      - name: Keep the TAP stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscxt-engine-${{ matrix.name }}-tap
          path: ${{ runner.temp }}/lcb-tests.tap
          if-no-files-found: ignore

      - name: Stage the library
        if: matrix.artifact != ''
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          for f in build/oscxt.dylib build/Release/oscxt.dll; do
            if [ -f "$f" ]; then cp "$f" "dist/${{ matrix.artifact }}/"; fi
          done
          test -n "$(ls "dist/${{ matrix.artifact }}/")"

      - name: Upload binary artifact
        if: matrix.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: oscxt-${{ matrix.artifact }}
          path: oscxt/dist/${{ matrix.artifact }}/
          if-no-files-found: error

  build-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two 64-bit Linux rows build where the release rows do: the
          # manylinux_2_28 image (glibc 2.28, its own gcc), so the compiler
          # and C library a release dispatch will use are the ones tested
          # here on every change.
          - name: linux-x86_64
            os: ubuntu-24.04
            platform_id: x86_64-linux
            container: quay.io/pypa/manylinux_2_28_x86_64
            acquire: manylinux
            cmake_args: ""
          - name: linux-x86
            os: ubuntu-24.04
            platform_id: x86-linux
            acquire: linux32
            cmake_args: "-DCMAKE_C_FLAGS=-m32"
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform_id: arm64-linux
            container: quay.io/pypa/manylinux_2_28_aarch64
            acquire: manylinux
            cmake_args: ""
          - name: windows-x86
            os: windows-2025
            platform_id: x86-win32
            acquire: none
            cmake_args: "-A Win32"
    runs-on: ${{ matrix.os }}
    # Empty for every row that does not set one, which Actions treats as "no
    # container".
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      # release-binaries.yml's step: cmake and ninja from the image's CPython.
      - name: Provision build tools (manylinux rows)
        if: matrix.acquire == 'manylinux'
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          PYBIN=/opt/python/cp312-cp312/bin
          "$PYBIN/python3" -m pip install --quiet cmake ninja
          ln -sf "$PYBIN/python3" /usr/local/bin/python3
          ln -sf "$PYBIN/cmake"   /usr/local/bin/cmake
          ln -sf "$PYBIN/ctest"   /usr/local/bin/ctest
          ln -sf "$PYBIN/ninja"   /usr/local/bin/ninja

      - name: Acquire 32-bit toolchain (Linux x86)
        if: matrix.acquire == 'linux32'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib cmake ninja-build

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOSCXT_BUILD_TESTS=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Stage the library
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform_id }}"
          for f in build/oscxt.so build/Release/oscxt.dll; do
            if [ -f "$f" ]; then cp "$f" "dist/${{ matrix.platform_id }}/"; fi
          done
          test -n "$(ls "dist/${{ matrix.platform_id }}/")"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oscxt-${{ matrix.platform_id }}
          path: oscxt/dist/${{ matrix.platform_id }}/
          if-no-files-found: ignore
