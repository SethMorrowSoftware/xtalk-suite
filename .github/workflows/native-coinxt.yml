# coinxt's native lane, at the ROOT of the monorepo.
#
# WHY THIS FILE EXISTS. Two reasons, and the first is a gap rather than a port:
#
#  1. coinxt's ASan + UBSan self-test was running NOWHERE in CI. suite-gates.yml
#     runs `build-all.sh --gates`, and the sanitizer self-test lives in the FULL
#     build-all path, which no root workflow invokes. `coin-kat.py --check` did
#     run (it compiles the shim from source in a temp dir and drives it through
#     ctypes), so the vectors were covered - but "the vectors are right" and "the
#     code is memory-clean" are different claims, and only the first had a gate.
#  2. coinxt/.github/workflows/ci.yml is inert here (GitHub Actions reads only
#     the repository root in a monorepo). That file stays for when the member is
#     developed in isolation; this is the copy that fires. Its duplicated static
#     gates are dropped here, because suite-gates.yml already runs them for every
#     member on every push - only the compiler work belongs in this file.
#
# WHAT IT DOES NOT DO: it does not commit binaries. Same rule as every other
# native-*.yml here - a native change refreshes its committed library in the same
# human-authored change, so each lane uploads an ARTIFACT and a maintainer
# commits deliberately. check-binary-freshness.py (in the always-on gates) is
# what makes forgetting that a build failure rather than a runtime surprise.
#
# LINUX ONLY, on purpose, and this is a scope statement rather than a limit
# anyone should be happy with. The other four members reach five platforms
# through CMake; coinxt builds with a POSIX sh script driving `cc`, and each
# missing platform needs real work rather than a matrix row:
#
#   * WINDOWS needs an MSYS2/MinGW toolchain AND a different export mechanism -
#     src/coinxt.map is GNU ld syntax, so MSVC would want a .def file.
#   * MACOS needs both slices lipo'd into one universal binary (a single-arch
#     dylib filed under `universal-mac` would be a lie about what it is), and
#     Mach-O ignores a version script, so it needs -exported_symbols_list to get
#     the same narrow surface. Neither has been tried.
#
# Adding a lane that has never been run, to claim a platform, is exactly what the
# suite's honesty convention exists to prevent. These are named here as open work
# (see coinxt/IMPLEMENTATION-PLAN.md phase 6), not quietly omitted.
name: native coinxt

on:
  pull_request:
    paths:
      - "coinxt/**"
      - ".github/workflows/native-coinxt.yml"
  push:
    branches: [main]
    paths:
      - "coinxt/**"
      - ".github/workflows/native-coinxt.yml"
  workflow_dispatch:

concurrency:
  group: native-coinxt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: coinxt

jobs:
  sanitize:
    name: shim ASan+UBSan + KATs (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Acquire toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      # The independent implementation the curve vectors are checked against.
      # coin-kat.py SKIPS that leg without it, which exits 0 and reads almost
      # like a pass, so COINXT_REQUIRE_CROSSCHECK below makes the skip fail.
      - name: Install the independent crypto implementation
        run: pip install ecdsa

      # The shim's own knob, not hand-rolled flags: build.sh compiles the shim
      # AND the vendored trezor-crypto units under -fsanitize=address,undefined
      # and runs the self-test executable it builds.
      - name: ASan + UBSan native self-test
        run: sh native/build.sh asan

      # Independent of the above: builds a fresh library from source and drives
      # every export through ctypes against public vectors (FIPS 180-4, RFC 4231,
      # BIP-39, the Ethereum keccak256 answers), including the Keccak-vs-SHA3
      # aliasing guard.
      - name: Known-answer vectors
        env:
          COINXT_REQUIRE_CROSSCHECK: "1"
        run: python3 tools/coin-kat.py --check

      # The phase-3 encoders are pure LiveCodeScript, which OXT cannot run
      # headlessly, so they are executed here instead: tools/lcs-interp.py
      # interprets the subset they use and drives the REAL file against the
      # published BIP-173 / BIP-350 / EIP-55 / RLP vectors, with the hashes
      # coming from the shim this job just built. Repeated from suite-gates.yml
      # for the same reason the freshness check is: so this lane stands alone on
      # a coinxt-only change.
      - name: The script encoders reproduce the published vectors
        run: python3 tools/check-script-vectors.py --check

      # Suite rule 5, mechanised: the committed src/code/ library must still
      # export exactly what the shim defines and answer the ABI the shim
      # declares. Runs in suite-gates.yml too; repeated here so this lane is
      # self-contained when it fires on a coinxt-only change.
      - name: Committed binary is current
        run: python3 tools/check-binary-freshness.py

  pack:
    name: pack ${{ matrix.platform_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: x86_64-linux
            os: ubuntu-24.04
            acquire: linux64
          - platform_id: x86-linux
            os: ubuntu-24.04
            acquire: linux32
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Acquire toolchain (Linux x86_64)
        if: matrix.acquire == 'linux64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Acquire 32-bit toolchain (Linux x86)
        if: matrix.acquire == 'linux32'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      # build.sh does not read CFLAGS - the supported way to cross-compile is a
      # wrapper `cc` on PATH, which keeps the script itself simple.
      - name: Provide a 32-bit cc
        if: matrix.acquire == 'linux32'
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec gcc -m32 "$@"\n' > "$HOME/bin/cc"
          chmod +x "$HOME/bin/cc"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # RUN the library that is actually committed, BEFORE the build below
      # overwrites it. Everything else in this job asks whether an artifact is
      # well-FORMED - right exports, right class, right path. This asks the only
      # question that matters to someone installing it: does it compute the
      # right answers?
      #
      # It needs a C driver rather than the Python KAT harness because a 64-bit
      # interpreter cannot ctypes.CDLL a 32-bit shared object, which is exactly
      # why this artifact has been the least-verified thing coinxt ships. The
      # driver is built by the lane's own cc, so on the x86 lane it is a 32-bit
      # process dlopen()ing a 32-bit library.
      #
      # The vectors are deliberately the load-bearing ones and no more: the ABI
      # number the binding checks, a published Keccak-256 answer (the hash
      # surface), and the published RFC 6979 signature plus its verification
      # (the curve surface, and the one that would catch a miscompiled bignum).
      #
      # The expected ABI is READ FROM THE SHIM SOURCE, never written here as a
      # literal. It was a literal until 2026-08-16, and the ABI 4 -> 5 bump for
      # cnx_memzero duly turned both Linux lanes red for no reason but this
      # file: the assertion tracked a number that lives somewhere else. Reading
      # native/coinxt.c is also the STRONGER check - "the committed binary
      # answers what this source says" is the question an installer cares
      # about, and it cannot go stale on the next bump.
      - name: Execute the COMMITTED library's vectors
        shell: bash
        run: |
          set -euo pipefail
          lib="src/code/${{ matrix.platform_id }}/coinxt.so"
          if [ ! -f "$lib" ]; then
            echo "no committed library for ${{ matrix.platform_id }}; nothing to execute"
            exit 0
          fi
          want_abi="$(sed -n 's/^#define CNX_ABI_VERSION \([0-9][0-9]*\).*/\1/p' native/coinxt.c)"
          if [ -z "$want_abi" ]; then
            echo "FAIL: could not read CNX_ABI_VERSION from native/coinxt.c"
            exit 1
          fi
          echo "  the shim source declares ABI $want_abi"
          cat > /tmp/drive.c <<'DRIVER'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stddef.h>
          static int hexeq(const unsigned char *b, int n, const char *want) {
            char h[160]; int i;
            for (i = 0; i < n; i++) sprintf(h + 2 * i, "%02x", b[i]);
            return strcmp(h, want) == 0;
          }
          int main(int argc, char **argv) {
            void *so; int rc, want_abi; unsigned char out[65], sk[32], dg[32], sig[64], pub[33];
            int (*abi)(void);
            int (*wipe)(void *, size_t);
            int (*keccak)(const unsigned char *, size_t, unsigned char *);
            int (*sha256)(const unsigned char *, size_t, unsigned char *);
            int (*sign)(const unsigned char *, size_t, const unsigned char *, size_t,
                        unsigned char *, size_t);
            int (*verify)(const unsigned char *, size_t, const unsigned char *, size_t,
                          const unsigned char *, size_t);
            int (*pubkey)(const unsigned char *, size_t, int, unsigned char *, size_t);
            int (*tweak)(const unsigned char *, size_t, const unsigned char *, size_t,
                         unsigned char *, size_t);
            int (*wordlist)(unsigned char *, size_t);
            size_t (*wordlist_len)(void);
            static unsigned char wl[2048 * 8];
            unsigned char kid[32];
            if (argc < 3) return 2;
            want_abi = atoi(argv[2]);
            so = dlopen(argv[1], RTLD_NOW);
            if (!so) { printf("dlopen failed: %s\n", dlerror()); return 1; }
            *(void **)&abi = dlsym(so, "cnx_abi_version");
            *(void **)&wipe = dlsym(so, "cnx_memzero");
            *(void **)&keccak = dlsym(so, "cnx_keccak256");
            *(void **)&sha256 = dlsym(so, "cnx_sha256");
            *(void **)&sign = dlsym(so, "cnx_ecdsa_sign");
            *(void **)&verify = dlsym(so, "cnx_ecdsa_verify");
            *(void **)&pubkey = dlsym(so, "cnx_pubkey_from_seckey");
            *(void **)&tweak = dlsym(so, "cnx_seckey_tweak_add");
            *(void **)&wordlist = dlsym(so, "cnx_bip39_wordlist");
            *(void **)&wordlist_len = dlsym(so, "cnx_bip39_wordlist_len");
            if (!abi || !keccak || !sha256 || !sign || !verify || !pubkey ||
                !tweak || !wordlist || !wordlist_len || !wipe) {
              printf("a required cnx_ symbol is missing\n"); return 1;
            }
            printf("  abi_version = %d (the shim source says %d)\n", abi(), want_abi);
            if (abi() != want_abi) {
              printf("FAIL: the committed library answers ABI %d, native/coinxt.c declares %d"
                     " -- rebuild and re-commit the binary in the same change\n",
                     abi(), want_abi);
              return 1;
            }
            if (keccak((const unsigned char *)"", 0, out) != 0 ||
                !hexeq(out, 32,
                  "c5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470")) {
              printf("FAIL: keccak256(\"\") vector\n"); return 1;
            }
            memset(sk, 0, sizeof sk); sk[31] = 1;
            if (pubkey(sk, 32, 1, pub, 33) != 0 || !hexeq(pub, 33,
                  "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798")) {
              printf("FAIL: private key 1 did not give the generator G\n"); return 1;
            }
            sha256((const unsigned char *)"Satoshi Nakamoto", 16, dg);
            rc = sign(sk, 32, dg, 32, sig, 64);
            if (rc != 0 || !hexeq(sig, 64,
                  "934b1ea10a4b3c1757e2b0c017d0b6143ce3c9a7e6a4a49860d7a6ab210ee3d8"
                  "2442ce9d2b916064108014783e923ec36b49743e2ffa1c4496f01a512aafd9e5")) {
              printf("FAIL: RFC 6979 signature vector (rc=%d)\n", rc); return 1;
            }
            if (verify(pub, 33, dg, 32, sig, 64) != 0) {
              printf("FAIL: the signature did not verify under its own key\n"); return 1;
            }
            sig[5] ^= 1;
            if (verify(pub, 33, dg, 32, sig, 64) != -5) {
              printf("FAIL: a tampered signature was not rejected\n"); return 1;
            }
            /* Phase 4, the same rule: do not claim a shipped artifact works
             * without running the part of it that is new. */
            if (wordlist_len() != sizeof wl) {
              printf("FAIL: cnx_bip39_wordlist_len\n"); return 1;
            }
            if (wordlist(wl, sizeof wl) != 0 || memcmp(wl, "abandon ", 8) != 0 ||
                memcmp(wl + 2047 * 8, "zoo     ", 8) != 0) {
              printf("FAIL: the BIP-39 wordlist did not come back intact\n"); return 1;
            }
            {
              unsigned char tw[32];
              memset(tw, 0, sizeof tw); tw[31] = 2;
              if (tweak(sk, 32, tw, 32, kid, 32) != 0 || kid[31] != 3) {
                printf("FAIL: cnx_seckey_tweak_add(1, 2) did not give 3\n"); return 1;
              }
              memset(tw, 0, sizeof tw);
              if (tweak(sk, 32, tw, 32, kid, 32) != -4) {
                printf("FAIL: a zero tweak was not refused\n"); return 1;
              }
            }
            /* cnx_memzero is the ABI 5 addition, so the same Phase 4 rule
             * applies to it. It matters most on THIS lane: the Python KAT
             * harness covers the wipe on x86_64 only (a 64-bit interpreter
             * cannot ctypes a 32-bit object - the reason this driver exists),
             * so without these lines the x86 library ships a secret-wiping
             * function nothing ever ran. Sentinel, then the NULL refusal. */
            {
              unsigned char buf[64]; int i;
              memset(buf, 0xAA, sizeof buf);
              if (wipe(buf, sizeof buf) != 0) {
                printf("FAIL: cnx_memzero refused a good buffer\n"); return 1;
              }
              for (i = 0; i < (int)sizeof buf; i++) {
                if (buf[i] != 0) { printf("FAIL: cnx_memzero left byte %d\n", i); return 1; }
              }
              memset(buf, 0xAA, sizeof buf);
              if (wipe(buf, 0) != 0 || buf[0] != 0xAA) {
                printf("FAIL: cnx_memzero(ptr, 0) was not a successful no-op\n"); return 1;
              }
              if (wipe(NULL, 0) != 0) {
                printf("FAIL: cnx_memzero(NULL, 0) was not tolerated\n"); return 1;
              }
              if (wipe(NULL, 32) != -1) {
                printf("FAIL: cnx_memzero(NULL, 32) was not refused\n"); return 1;
              }
            }
            printf("  committed library executed OK (ABI %d, keccak, G, RFC 6979,"
                   " verify, BIP-32/39, memzero)\n", abi());
            dlclose(so);
            return 0;
          }
          DRIVER
          cc -O1 -o /tmp/drive /tmp/drive.c -ldl
          file /tmp/drive "$lib"
          /tmp/drive "$(pwd)/$lib" "$want_abi"

      # The platform id is passed EXPLICITLY. build.sh derives it from `uname`
      # when you do not, and uname describes the machine, not the output - the
      # 32-bit lane above still reports x86_64, so a derived path would file an
      # x86 library into x86_64-linux/. Cross builds must say what they are.
      - name: Build the shipped library
        shell: bash
        run: sh native/build.sh pack ${{ matrix.platform_id }}

      # The build prints its exported symbol list; assert on it rather than
      # trusting the eye. Anything beyond the cnx_* surface means the version
      # script did not apply, which is the one failure mode that produces a
      # working library you must not ship.
      - name: Confirm the artifact and its export surface
        shell: bash
        run: |
          ls -l "src/code/${{ matrix.platform_id }}/"
          test -f "src/code/${{ matrix.platform_id }}/coinxt.so"
          leaked=$(nm -D --defined-only "src/code/${{ matrix.platform_id }}/coinxt.so" \
                   | awk '{print $NF}' | grep -v '^cnx_' || true)
          if [ -n "$leaked" ]; then
            echo "coinxt.so exports non-cnx_ symbols; src/coinxt.map did not apply:" >&2
            echo "$leaked" >&2
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coinxt-${{ matrix.platform_id }}
          path: coinxt/src/code/${{ matrix.platform_id }}/
          if-no-files-found: ignore
