# curlxt's native build matrix, at the ROOT of the monorepo (GitHub runs only
# root workflows here; member workflows are generated for published repos).
#
# WHAT IT DOES NOT DO: it does not commit binaries. Each lane uploads its
# library as an ARTIFACT; committed binaries come from the suite's manual
# release-binaries.yml dispatch (suite rule 5).
#
# The sanitize job is the member's real gate: the shim's smoke test under
# ASan/UBSan, and then the SCRIPT layers run over the freshly built library
# (tools/run-gates.sh with CURLXT_REQUIRE_LIB=1, so the execution gates can
# never quietly skip here).
#
# The engine job is the same layers on a REAL engine: the binding compiled
# with OXT-Beyond's lc-compile -Werror, and tests/engine-selftest.lc run on
# that release's headless server engine over a Release build, against
# loopback HTTP, ws:// and wss:// servers (tools/run-engine-selftest.py).
# Then the desktop demo, examples/curlxt-live.livecodescript, runs start to
# finish on the same release's DESKTOP engine with no screen
# (tools/run-engine-demo.py): it serves its own scenes on the engine's
# sockets, which the server engine does not deliver.
name: native curlxt

on:
  pull_request:
    paths:
      - "curlxt/**"
      - "!curlxt/docs/**"
      - "!curlxt/**/*.md"
      - "curlxt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-curlxt.yml"
  push:
    branches: [main]
    paths:
      - "curlxt/**"
      - "!curlxt/docs/**"
      - "!curlxt/**/*.md"
      - "curlxt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-curlxt.yml"
  workflow_dispatch:

concurrency:
  group: native-curlxt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"
  # The OXT-Beyond release whose lc-compile and server engine the `engine`
  # job uses: lce-packages.yml's pins, as native-box3dxt.yml's are, so one
  # engine build compiles and runs every member's modules. Bump them together.
  OXT_BEYOND_REPO: SethMorrowSoftware/OpenXTalk-Beyond
  OXT_BEYOND_TAG: v0.2.7-rc.6
  OXT_BEYOND_BINARIES: OXT-Beyond-0.2.7-rc.6-linux-x86_64-binaries.tar.xz
  OXT_BEYOND_BINARIES_SHA256: 12504ee02cbf26c59f218263724790853b50993ebdda02546df66bcf6525add8

defaults:
  run:
    working-directory: curlxt

jobs:
  sanitize:
    name: ASan+UBSan and the script layers (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain + OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libssl-dev
      - name: Configure + build + test under sanitizers
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCURLXT_BUILD_TESTS=ON \
            -DCURLXT_SANITIZE=address
          cmake --build build-asan --parallel 4
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error
      - name: Release build for the script gates
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      - name: The member's gates, over the built library
        run: |
          CURLXT_LIB="$PWD/build/curlxt.so" CURLXT_REQUIRE_LIB=1 bash tools/run-gates.sh

  engine:
    name: the binding and its demo on OXT-Beyond's engines (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain + OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libssl-dev
      - name: Release build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      # lc-compile, modules/lci, the server engine and the desktop one from
      # the release's binaries archive, checked against its pin (the folder
      # is renamed from linux-x86_64-bin: a folder of that name in the
      # engine's path makes the engine look for a source checkout).
      - name: Fetch OXT-Beyond's tools
        run: |
          oxt="$RUNNER_TEMP/oxt"
          mkdir -p "$oxt"
          base="https://github.com/$OXT_BEYOND_REPO/releases/download/$OXT_BEYOND_TAG"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/bin.tar.xz" "$base/$OXT_BEYOND_BINARIES"
          echo "$OXT_BEYOND_BINARIES_SHA256  $RUNNER_TEMP/bin.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/bin.tar.xz" -C "$oxt" --wildcards \
            'linux-x86_64-bin/lc-compile' 'linux-x86_64-bin/server-community' \
            'linux-x86_64-bin/server-revzip.so' 'linux-x86_64-bin/server-revxml.so' \
            'linux-x86_64-bin/standalone-community' 'linux-x86_64-bin/modules/lci/*'
          mv "$oxt/linux-x86_64-bin" "$oxt/engine"
          rm "$RUNNER_TEMP/bin.tar.xz"
      # -Werror, as the IDE's Extension Builder runs it: a warning here is a
      # module nobody can install.
      - name: Compile the binding (lc-compile -Werror)
        run: |
          mkdir -p "$RUNNER_TEMP/lcb"
          "$RUNNER_TEMP/oxt/engine/lc-compile" -Werror \
            --modulepath "$RUNNER_TEMP/oxt/engine/modules/lci" \
            --modulepath "$RUNNER_TEMP/lcb" \
            --output "$RUNNER_TEMP/lcb/curl.lcm" src/curl.lcb
      # The driver checks the test's sweep against the binding, starts the
      # servers and runs the engine. Green needs the engine's exit 0 AND a
      # SUMMARY line with no failure and at least the driver's floor of
      # checks: an engine that printed nothing must not read as a pass.
      - name: Run tests/engine-selftest.lc on the engine
        run: |
          set -o pipefail
          python3 tools/run-engine-selftest.py "$RUNNER_TEMP/oxt/engine/server-community" \
            "$RUNNER_TEMP/lcb/curl.lcm" "$PWD/build/curlxt.so" | tee "$RUNNER_TEMP/engine.log"
          {
            echo "Engine self-test: $(grep '^SUMMARY ' "$RUNNER_TEMP/engine.log" | tail -n 1 | awk '{print $2 " passed, " $3 " failed"}') on OXT-Beyond $OXT_BEYOND_TAG (Linux x86-64)."
            grep '^INFO ' "$RUNNER_TEMP/engine.log" | sed 's/^INFO /- /'
          } >> "$GITHUB_STEP_SUMMARY"
      # The desktop demo on the desktop engine started with -ui: no display,
      # every socket message delivered. The driver presses each scene's
      # button, reads the scene's own verdict, and closes and reopens the
      # demo; green needs the engine's exit 0 and a clean SUMMARY of at least
      # the runner's floor. It sees no pixel: the look still needs a screen.
      - name: Run the desktop demo on the desktop engine
        run: |
          set -o pipefail
          python3 tools/run-engine-demo.py "$RUNNER_TEMP/oxt/engine/standalone-community" \
            "$RUNNER_TEMP/lcb/curl.lcm" "$PWD/build/curlxt.so" | tee "$RUNNER_TEMP/demo.log"
          {
            echo "Desktop demo: $(grep '^SUMMARY ' "$RUNNER_TEMP/demo.log" | tail -n 1 | awk '{print $2 " passed, " $3 " failed"}') on OXT-Beyond $OXT_BEYOND_TAG's desktop engine (Linux x86-64, no screen)."
            grep '^INFO ' "$RUNNER_TEMP/demo.log" | sed 's/^INFO /- /'
          } >> "$GITHUB_STEP_SUMMARY"

  build-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            platform_id: x86_64-linux
            acquire: linux64
            cmake_args: ""
          # The i386 OpenSSL must be named explicitly or the link fails with
          # "file in wrong format" (datachannelxt's lesson).
          - name: linux-x86
            os: ubuntu-24.04
            platform_id: x86-linux
            acquire: linux32
            cmake_args: "-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DOPENSSL_SSL_LIBRARY=/usr/lib/i386-linux-gnu/libssl.so -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so -DOPENSSL_INCLUDE_DIR=/usr/include"
          # Host arch only: Homebrew's OpenSSL is one slice. A universal
          # dylib is the release workflow's two-slice lipo job.
          - name: macos
            os: macos-15
            platform_id: universal-mac
            acquire: brew
            cmake_args: ""
          - name: windows-x86_64
            os: windows-2025
            platform_id: x86_64-win32
            acquire: none
            cmake_args: "-A x64"
          - name: windows-x86
            os: windows-2025
            platform_id: x86-win32
            acquire: none
            cmake_args: "-A Win32"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Acquire toolchain + OpenSSL (Linux x86_64)
        if: matrix.acquire == 'linux64'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libssl-dev

      - name: Acquire 32-bit toolchain + i386 OpenSSL (Linux x86)
        if: matrix.acquire == 'linux32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib ninja-build
          sudo apt-get install -y libssl-dev:i386

      - name: Acquire OpenSSL (Homebrew, macOS)
        if: matrix.acquire == 'brew'
        run: |
          brew update
          brew install openssl@3 ninja
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCURLXT_BUILD_TESTS=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Stage the library
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform_id }}"
          for f in build/curlxt.so build/curlxt.dylib build/Release/curlxt.dll; do
            if [ -f "$f" ]; then cp "$f" "dist/${{ matrix.platform_id }}/"; fi
          done

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curlxt-${{ matrix.platform_id }}
          path: curlxt/dist/${{ matrix.platform_id }}/
          if-no-files-found: ignore
