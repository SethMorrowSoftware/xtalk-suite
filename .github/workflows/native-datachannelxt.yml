# datachannelxt's native build matrix, ported to the ROOT of the monorepo.
# See native-enetxt.yml for why this file exists, and why it uploads artifacts
# instead of committing binaries.
name: native datachannelxt

on:
  pull_request:
    paths:
      - "datachannelxt/**"
      - ".github/workflows/native-datachannelxt.yml"
  push:
    branches: [main]
    paths:
      - "datachannelxt/**"
      - ".github/workflows/native-datachannelxt.yml"
  workflow_dispatch:

concurrency:
  group: native-datachannelxt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: datachannelxt

jobs:
  # This member owns the family's only true cross-thread concurrency (every
  # libdatachannel callback arrives on a worker thread), so BOTH sanitizer
  # lanes are part of its "done" bar, not optional extras. The sanitize knob is
  # global and injected before FetchContent so the whole static stack is
  # instrumented; per-target flags would leave the dependency uninstrumented
  # and TSan would false-positive on its internals.
  sanitize-address:
    name: full-stack ASan+UBSan (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain + OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libssl-dev
      - name: Configure + build + test under ASan/UBSan
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDATACHANNELXT_BUILD_TESTS=ON \
            -DDATACHANNELXT_SANITIZE=address
          cmake --build build-asan --parallel 4
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error

  sanitize-thread:
    name: full-stack ThreadSanitizer (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain + OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libssl-dev
      # The suppressions file may only ever name races wholly inside a vendored
      # dependency (usrsctp's SACK fast path); a report with a shim frame among
      # the racing accesses is ours and must fail this lane.
      - name: Configure + build + test under TSan
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDATACHANNELXT_BUILD_TESTS=ON \
            -DDATACHANNELXT_SANITIZE=thread
          cmake --build build-tsan --parallel 4
          TSAN_OPTIONS="halt_on_error=1:suppressions=$PWD/tests/tsan-suppressions.txt" \
            ctest --test-dir build-tsan --output-on-failure --no-tests=error

  build-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - FetchContent libdatachannel, statically linked into
          # our one .so; OpenSSL stays a dynamic NEEDED dep (present on every
          # Linux target).
          - name: linux-x86_64
            os: ubuntu-24.04
            platform_id: x86_64-linux
            acquire: linux64
            cmake_args: ""
          # Linux x86 (32-bit) - the same source build under -m32 against the
          # i386 OpenSSL, which find_package must be pointed at explicitly or
          # the link fails with "file in wrong format".
          - name: linux-x86
            os: ubuntu-24.04
            platform_id: x86-linux
            acquire: linux32
            cmake_args: "-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DOPENSSL_SSL_LIBRARY=/usr/lib/i386-linux-gnu/libssl.so -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so -DOPENSSL_INCLUDE_DIR=/usr/include"
          # macOS (host arch) - Homebrew OpenSSL. A universal + notarized dylib
          # is a separate release build, not this lane's artifact.
          - name: macos
            os: macos-15
            platform_id: universal-mac
            acquire: brew
            cmake_args: ""
          - name: windows-x86_64
            os: windows-2025
            platform_id: x86_64-win32
            acquire: vcpkg
            vcpkg_triplet: x64-windows-static
            cmake_args: ""
          - name: windows-x86
            os: windows-2025
            platform_id: x86-win32
            acquire: vcpkg
            vcpkg_triplet: x86-windows-static
            cmake_args: "-A Win32"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (for package-extension.py)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Acquire toolchain + OpenSSL (Linux x86_64)
        if: matrix.acquire == 'linux64'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libssl-dev

      - name: Acquire 32-bit toolchain + i386 OpenSSL (Linux x86)
        if: matrix.acquire == 'linux32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # The 32-bit C/C++ toolchain MUST succeed on its OWN line - it
          # provides Scrt1.o, crti.o, lib32stdc++, lib32gcc that -m32 needs.
          sudo apt-get install -y g++-multilib gcc-multilib ninja-build
          sudo apt-get install -y libssl-dev:i386

      - name: Acquire OpenSSL (Homebrew, macOS)
        if: matrix.acquire == 'brew'
        run: |
          brew update
          brew install openssl@3 ninja

      - name: Set up vcpkg + acquire OpenSSL (Windows)
        if: matrix.acquire == 'vcpkg'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg\vcpkg.exe" install "openssl:${{ matrix.vcpkg_triplet }}"
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}" >> $env:GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}"
            if [ -n "${VCPKG_TARGET_TRIPLET:-}" ]; then
              EXTRA="$EXTRA -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET}"
            fi
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDATACHANNELXT_BUILD_TESTS=ON \
            ${{ matrix.cmake_args }} \
            $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Stage per-platform binary
        shell: bash
        run: |
          python3 tools/package-extension.py \
            --platform-id ${{ matrix.platform_id }} \
            --build-dir build || \
            echo "package-extension: nothing to stage."

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datachannelxt-${{ matrix.platform_id }}
          path: datachannelxt/src/code/${{ matrix.platform_id }}/
          if-no-files-found: ignore
