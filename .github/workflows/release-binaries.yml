# release-binaries.yml - ONE dispatch that builds every member's native library
# for every platform it can be built for, and publishes them as a single bundle.
#
# WHY. The per-member native-*.yml workflows already build these matrices, but
# they are paths-filtered (they fire only when their member changes) and each
# uploads its own per-platform artifact. Assembling a release from them means
# waiting on five runs and downloading ~17 artifacts one at a time, which is
# exactly the friction that has left enetxt, datachannelxt, and coinxt shipping
# x86_64-linux only while CI was quietly building the other platforms all along.
# This workflow is the assembly step: run it once, get one bundle.
#
# IT LANDS THEM TOO. The final job installs every built library into its own
# member's src/code/<platform-id>/, refreshes each MANIFEST.sha256, and commits.
#
# That is a deliberate narrowing of suite rule 5, not an abandonment of it. The
# rule exists so a committed binary is always traceable to a human decision and
# to the source that produced it. What it actually forbids is a binary arriving
# without anyone choosing it - and the danger case is an AUTOMATIC workflow: the
# per-member native-*.yml files fire on every push, so a commit step there would
# push binaries nobody asked for, on somebody else's change. Those still upload
# artifacts and nothing else, and that has not changed.
#
# This workflow is different in the one way that matters: it only ever runs
# because a person pressed "Run workflow". The human decision is still there; it
# moved from "download 17 artifacts and run a local command" to "press the
# button". Everything the local installer checked, the commit job still checks,
# because it RUNS the local installer (tools/install-release-binaries.py) rather
# than reimplementing it - name, object format, architecture-vs-directory, and
# coinxt's export surface are all verified before a single file is written, and
# the whole static gate set runs afterwards. A bad artifact fails the job with
# nothing committed.
#
#   commit_mode: branch  (default) commit straight to the branch you dispatched
#                        on. This is what the members' standalone repositories
#                        did before consolidation.
#                pr      push to a release-binaries/<run> branch and open a PR,
#                        when you would rather look before it lands.
#                none    just the bundle; run
#                        `python3 tools/install-release-binaries.py <dir>`
#                        yourself.
#
# NO macOS LANES AT ALL, and this is a correctness decision rather than a
# convenience one. GitHub's macos-15 runners are arm64-only, so a plain build
# there produces a THIN arm64 dylib - and the engine's directory for macOS is
# `universal-mac`, which promises the opposite. Committing that would have
# actively REGRESSED the suite: sodiumxt/src/code/universal-mac/sodiumxt.dylib
# is today a genuine fat binary carrying two architectures, and a release run
# would have replaced it with an arm64-only file that fails to load on every
# Intel Mac, silently and only for users. torrentxt has documented its own
# version of this trap for a while (see
# torrentxt/src/code/universal-mac/README.md); it turns out to apply to every
# member, not just that one.
#
# Shipping macOS properly needs work this workflow does not do: build each slice
# and `lipo` them into one fat library, and for torrentxt additionally codesign
# and notarize with Apple Developer credentials CI does not hold. Until that
# exists, the macOS libraries stay a deliberate manual build - and
# tools/install-release-binaries.py REFUSES a thin Mach-O under universal-mac,
# so a hand-assembled bundle cannot make this mistake either.
name: release binaries

on:
  workflow_dispatch:
    inputs:
      commit_mode:
        description: "How to land the built binaries"
        type: choice
        options: [branch, pr, none]
        default: branch
        required: false

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

# Read by default; the commit job raises its own to contents: write. Scoping it
# per job rather than per workflow means every BUILD job runs with no write token
# at all, so the only step that can alter the repository is the one whose whole
# purpose is to.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CMake four
  # sodiumxt, torrentxt, enetxt and datachannelxt all build through CMake with
  # the same shape, so one matrix covers them. Each member's own
  # tools/package-extension.py does the placing and stripping, exactly as the
  # per-member workflows do - this is an assembly workflow, not a second build
  # system, and it must not diverge from what those lanes produce.
  cmake-members:
    name: ${{ matrix.member }} ${{ matrix.platform_id }}
    strategy:
      fail-fast: false
      matrix:
        # EVERY COMBINATION IS SPELLED OUT, on purpose. The first version of this
        # job used a member x platform cross product with one shared set of
        # per-platform settings, and 9 of 20 jobs failed on the first real run -
        # every one of them a missing dependency, none of them a code problem.
        # The four members genuinely do NOT share a setup: torrentxt needs Boost
        # and OpenSSL and zlib, sodiumxt builds libsodium from source and needs
        # a --host triple to cross to 32-bit, datachannelxt needs OpenSSL (and
        # i386 OpenSSL for the 32-bit lane), enetxt needs nothing at all, and on
        # Windows three of them want different vcpkg ports and sodiumxt wants a
        # different generator entirely. A shared matrix cannot express that.
        #
        # These rows are PORTED VERBATIM from each member's own native-*.yml,
        # which is the copy that is known to work. When a member's dependencies
        # change, change them there and mirror the row here - do not re-derive
        # them, which is what produced the failure above.
        include:
          # ---- sodiumxt: builds libsodium from source; vcpkg + NMake on Windows
          - member: sodiumxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            apt: g++ cmake ninja-build
          - member: sodiumxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib cmake ninja-build
            # The -m32 must reach the libsodium sub-build too, hence its own
            # CFLAGS and a configure --host; without them the sub-build stays
            # x86_64 and the link fails "incompatible with i386 output".
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DSODIUMXT_LIBSODIUM_CFLAGS=-m32 -DSODIUMXT_LIBSODIUM_CONFIGURE_EXTRA=--host=i686-pc-linux-gnu
          - member: sodiumxt
            platform_id: x86_64-win32
            os: windows-2025
            vcpkg_port: libsodium
            triplet: x64-windows-static
            msvc_arch: amd64
            win_style: nmake
          - member: sodiumxt
            platform_id: x86-win32
            os: windows-2025
            vcpkg_port: libsodium
            triplet: x86-windows-static
            msvc_arch: x86
            win_style: nmake

          # ---- torrentxt: Boost + OpenSSL + zlib; libtorrent from vcpkg on Windows
          - member: torrentxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            apt: g++ cmake ninja-build libboost-dev libssl-dev zlib1g-dev
            build_jobs: 2          # libtorrent from source OOMs a runner at -j4
          - member: torrentxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib ninja-build libboost-dev
            apt_i386: libssl-dev:i386 zlib1g-dev:i386
            build_jobs: 2
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DOPENSSL_SSL_LIBRARY=/usr/lib/i386-linux-gnu/libssl.so -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so -DOPENSSL_INCLUDE_DIR=/usr/include -DZLIB_LIBRARY=/usr/lib/i386-linux-gnu/libz.so -DZLIB_INCLUDE_DIR=/usr/include
          - member: torrentxt
            platform_id: x86_64-win32
            os: windows-2025
            vcpkg_port: libtorrent
            triplet: x64-windows-static
            cmake_args: -DTORRENTXT_USE_SYSTEM_LIBTORRENT=ON
          - member: torrentxt
            platform_id: x86-win32
            os: windows-2025
            vcpkg_port: libtorrent
            triplet: x86-windows-static
            cmake_args: -DTORRENTXT_USE_SYSTEM_LIBTORRENT=ON -A Win32

          # ---- enetxt: ENet is vendored/fetched; no external dependency at all
          - member: enetxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            apt: g++ cmake ninja-build
          - member: enetxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib cmake ninja-build
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
          - member: enetxt
            platform_id: x86_64-win32
            os: windows-2025
            cmake_args: -A x64
          - member: enetxt
            platform_id: x86-win32
            os: windows-2025
            cmake_args: -A Win32

          # ---- datachannelxt: OpenSSL, including the i386 one for the 32-bit lane
          - member: datachannelxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            apt: g++ cmake ninja-build libssl-dev
          - member: datachannelxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib ninja-build
            apt_i386: libssl-dev:i386
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DOPENSSL_SSL_LIBRARY=/usr/lib/i386-linux-gnu/libssl.so -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so -DOPENSSL_INCLUDE_DIR=/usr/include
          - member: datachannelxt
            platform_id: x86_64-win32
            os: windows-2025
            vcpkg_port: openssl
            triplet: x64-windows-static
          - member: datachannelxt
            platform_id: x86-win32
            os: windows-2025
            vcpkg_port: openssl
            triplet: x86-windows-static
            cmake_args: -A Win32
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.member }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Acquire apt packages
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      # A SEPARATE apt call, and a separate line for the toolchain above it, both
      # deliberate: the 32-bit C/C++ toolchain provides Scrt1.o, crti.o,
      # lib32stdc++ and lib32gcc that -m32 needs, and folding it in with the
      # i386 library packages makes a resolver conflict take the toolchain down
      # with it (datachannelxt's own workflow carries this note).
      - name: Acquire i386 libraries
        if: matrix.apt_i386
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_i386 }}

      - name: Set up vcpkg
        if: matrix.vcpkg_port
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg\vcpkg.exe" install "${{ matrix.vcpkg_port }}:${{ matrix.triplet }}"
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" >> $env:GITHUB_ENV

      # The NMake generator invokes nmake.exe and cl.exe DIRECTLY, so it only
      # works inside an MSVC developer environment. The Visual Studio generator
      # that every other Windows lane uses locates the toolchain itself and
      # needs nothing here - which is exactly why sodiumxt was the only member
      # to fail with "'nmake' '-?' ... no such file or directory" while
      # enetxt, datachannelxt and torrentxt built fine beside it.
      - name: Set up MSVC (Windows, NMake lanes only)
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # sodiumxt's Windows lane needs its own generator and runtime setting, so
      # it gets its own step rather than being bent into the shared one.
      - name: Configure, build, test (sodiumxt / Windows / NMake)
        if: matrix.win_style == 'nmake'
        shell: pwsh
        run: |
          cmake -S . -B build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DSODIUMXT_BUILD_TESTS=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Configure
        if: matrix.win_style != 'nmake'
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}"
            if [ -n "${VCPKG_TARGET_TRIPLET:-}" ]; then
              EXTRA="$EXTRA -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET}"
            fi
          fi
          flag="$(printf '%s' "${{ matrix.member }}" | tr '[:lower:]' '[:upper:]')_BUILD_TESTS"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-D${flag}=ON" ${{ matrix.cmake_args }} $EXTRA

      - name: Build
        if: matrix.win_style != 'nmake'
        run: cmake --build build --config Release --parallel ${{ matrix.build_jobs || 4 }}

      # --no-tests=error: ctest exits 0 on an EMPTY test set, so without this a
      # misconfigured lane reports green having run nothing. A release artifact
      # that passed no test is worse than no artifact.
      - name: Test
        if: matrix.win_style != 'nmake'
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Stage the per-platform library
        shell: bash
        run: |
          python3 tools/package-extension.py \
            --platform-id ${{ matrix.platform_id }} --build-dir build

      - name: Confirm something landed
        shell: bash
        run: |
          ls -l "src/code/${{ matrix.platform_id }}/"
          test -n "$(ls src/code/${{ matrix.platform_id }}/${{ matrix.member }}.* 2>/dev/null)"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.member }}-${{ matrix.platform_id }}
          path: ${{ matrix.member }}/src/code/${{ matrix.platform_id }}/
          if-no-files-found: error

  # -------------------------------------------------------------------- coinxt
  # coinxt builds from a shell script, not CMake, so it gets its own job.
  #
  # The Windows libraries are CROSS-COMPILED from Linux with MinGW rather than
  # built on a Windows runner. That is not a shortcut: build.sh is POSIX sh, the
  # cross toolchain is one apt install, and it produces the same narrow export
  # surface (verified locally: exactly the 16 cnx_* symbols in the PE export
  # table, via a generated .def - MinGW auto-exports all 77 globals otherwise,
  # and a version script is silently IGNORED for PE, which fails OPEN).
  #
  # EXECUTION, not just a well-formed export table: the kat-windows job below
  # drives the published vectors through the real cross-built DLL on a real
  # Windows runner, so the x86_64-win32 artifact is execution-proven rather than
  # merely correct-looking. Every platform this job emits is covered that way or
  # is native Linux, which build-all already exercises.
  coinxt:
    name: coinxt ${{ matrix.platform_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: x86_64-linux
            os: ubuntu-24.04
            acquire: linux64
          - platform_id: x86-linux
            os: ubuntu-24.04
            acquire: linux32
          - platform_id: x86_64-win32
            os: ubuntu-24.04
            acquire: mingw64
          - platform_id: x86-win32
            os: ubuntu-24.04
            acquire: mingw32
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: coinxt
    steps:
      - uses: actions/checkout@v4

      - name: Acquire toolchain
        shell: bash
        run: |
          case "${{ matrix.acquire }}" in
            linux64) sudo apt-get update && sudo apt-get install -y gcc ;;
            linux32) sudo apt-get update && sudo apt-get install -y gcc-multilib ;;
            mingw64) sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 ;;
            mingw32) sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 ;;
          esac

      # build.sh takes CC/NM/STRIP from the environment precisely so a cross
      # build needs no PATH games, and the platform id is passed EXPLICITLY
      # because uname describes the machine, not the output.
      - name: Build the shipped library
        shell: bash
        run: |
          case "${{ matrix.acquire }}" in
            linux32)
              mkdir -p "$HOME/bin"
              printf '#!/bin/sh\nexec gcc -m32 "$@"\n' > "$HOME/bin/cc"
              chmod +x "$HOME/bin/cc"
              export PATH="$HOME/bin:$PATH"
              ;;
            mingw64)
              export CC=x86_64-w64-mingw32-gcc NM=x86_64-w64-mingw32-nm STRIP=x86_64-w64-mingw32-strip ;;
            mingw32)
              export CC=i686-w64-mingw32-gcc NM=i686-w64-mingw32-nm STRIP=i686-w64-mingw32-strip ;;
          esac
          sh native/build.sh pack ${{ matrix.platform_id }}

      # The export surface is the one thing that fails OPEN - a wrong mechanism
      # gives you a WORKING library with 77 exports - so assert it per format
      # rather than trusting the build's own printout.
      - name: Assert the export surface is exactly cnx_*
        shell: bash
        run: |
          set -euo pipefail
          d="src/code/${{ matrix.platform_id }}"
          case "${{ matrix.platform_id }}" in
            *-linux)
              leaked=$(nm -D --defined-only "$d/coinxt.so" | awk '{print $NF}' | grep -v '^cnx_' || true) ;;
            *-win32)
              tc=x86_64-w64-mingw32; [ "${{ matrix.platform_id }}" = x86-win32 ] && tc=i686-w64-mingw32
              leaked=$($tc-objdump -p "$d/coinxt.dll" \
                       | awk '/\[Ordinal\/Name Pointer\] Table/{f=1;next} f&&/^$/{exit} f{print $NF}' \
                       | grep -v '^cnx_' || true) ;;
          esac
          if [ -n "$leaked" ]; then
            echo "coinxt exports symbols outside the cnx_ surface:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "export surface OK"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-coinxt-${{ matrix.platform_id }}
          path: coinxt/src/code/${{ matrix.platform_id }}/
          if-no-files-found: error

  # An artifact whose export table is right but which nobody ever RAN is a weak
  # thing to ship in a library that handles money. This runs the published KAT
  # vectors against the real cross-built DLL on a real Windows runner, so the
  # x86_64-win32 artifact is execution-proven and not merely well-formed.
  kat-windows:
    name: coinxt x86_64-win32 KATs (on Windows)
    needs: coinxt
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: bundle-coinxt-x86_64-win32
          path: dll
      - name: Drive the DLL through the published vectors
        shell: bash
        run: python3 coinxt/tools/coin-kat.py --check --lib dll/coinxt.dll

  bundle:
    name: collect one bundle
    needs: [cmake-members, coinxt, kat-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: staged
      - name: Lay the bundle out the way the installer expects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          # Artifact names are bundle-<member>-<platform_id>; rebuild
          # <member>/<platform_id>/ from that so the local installer needs no
          # mapping table of its own.
          for d in staged/bundle-*; do
            base=$(basename "$d")
            rest=${base#bundle-}
            member=${rest%%-*}
            platform=${rest#*-}
            mkdir -p "bundle/$member/$platform"
            cp -r "$d"/. "bundle/$member/$platform/"
          done
          find bundle -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: bundle/
          if-no-files-found: error

  # ---------------------------------------------------------------- land them
  # Install every built library into its member's src/code/<platform-id>/,
  # refresh the manifests, and commit.
  #
  # `needs` plus an explicit success check, NOT `if: always()`. The bundle job
  # deliberately runs on partial failure so you can see what DID build;
  # committing must not. A half-built release that lands four platforms of five
  # is worse than no release, because the missing one looks deliberate afterwards.
  commit-binaries:
    name: install into each extension and commit
    needs: [cmake-members, coinxt, kat-windows, bundle]
    if: >-
      github.event.inputs.commit_mode != 'none' &&
      needs.cmake-members.result == 'success' &&
      needs.coinxt.result == 'success' &&
      needs.kat-windows.result == 'success' &&
      needs.bundle.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history is not needed, but the REF is: we commit back onto the
      # branch the run was dispatched from, so check that out by name rather than
      # relying on the detached default.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Unpack OUTSIDE the working tree. The bundle is a second copy of every
      # library, so a staging directory inside the checkout is one `git add -A`
      # away from being committed alongside the real update - which is exactly
      # what run 3 did, landing 54.5 MB of duplicates under `incoming/`. The
      # installer takes the bundle path as an argument, so there is no reason
      # for it to live in the repository at all.
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release-bundle

      # The SAME verifier the local path uses - not a reimplementation. It checks
      # each library's filename against the member, its object format and
      # architecture against the directory it claims (read from the ELF/PE/Mach-O
      # header, which is what catches a cross build that reported the build
      # machine's arch), and coinxt's export surface. It refuses to write
      # anything at all if any file fails, so a bad artifact cannot land a
      # partial update.
      - name: Verify, then install into each extension
        run: python3 tools/install-release-binaries.py "$RUNNER_TEMP/release-bundle"

      # Proof the tree is still coherent AFTER the write: the MANIFEST.sha256
      # files the installer just refreshed, coinxt's binary-freshness gate
      # (exports and ABI against the shim source), and every other static gate.
      # If this fails, nothing is pushed.
      - name: Static gates over the updated tree
        run: bash tools/build-all.sh --gates

      # NOTE for anyone editing below: every line of a `run: |` block must stay
      # indented. A multi-line commit message written flush-left terminates the
      # YAML block scalar and breaks the whole workflow file - which is exactly
      # what the first draft of this step did. Hence repeated -m flags (each
      # becomes its own paragraph) rather than an inline multi-line string.
      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every committed binary already matched this build; nothing to do."
            exit 0
          fi
          # `git add -A` is deliberately broad, so bound what it is allowed to
          # have caught. The installer writes in exactly one shape - a library
          # under <member>/src/code/<platform-id>/ or the MANIFEST.sha256 beside
          # it - and anything else staged here is something this job dragged in
          # rather than produced. Refusing is the whole point: run 3 committed a
          # 54.5 MB second copy of the bundle and the push succeeded, because
          # nothing between `git add -A` and `git push` ever looked at the list.
          stray=$(git diff --cached --name-only \
                  | grep -Ev '^[a-z]+xt/src/code/([^/]+/[^/]+|MANIFEST\.sha256)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::staged paths outside <member>/src/code/ - refusing to commit:" >&2
            echo "$stray" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --stat
          git commit \
            -m "Refresh the committed native libraries from a release build" \
            -m "Built by .github/workflows/release-binaries.yml, run ${{ github.run_id }}, from ${{ github.sha }}." \
            -m "Every library was verified by tools/install-release-binaries.py before it was written: filename against the member, object format and architecture against the directory it claims, and coinxt's export surface. The full static gate set, including each MANIFEST.sha256 and coinxt's binary-freshness check, passed over the result."

      # Push with rebase-and-retry: another push can land between our checkout and
      # this step, and losing that race would mean re-running 24 build jobs.
      - name: Push to ${{ github.ref_name }}
        if: steps.commit.outputs.changed == 'true' && github.event.inputs.commit_mode != 'pr'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed"
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing onto the branch tip"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep $((attempt * 2))
          done
          echo "could not push after 4 attempts" >&2
          exit 1

      - name: Open a pull request instead
        if: steps.commit.outputs.changed == 'true' && github.event.inputs.commit_mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release-binaries/${{ github.run_id }}"
          git push origin "HEAD:$branch"
          {
            echo "Built by \`release-binaries.yml\` (run ${{ github.run_id }}) from ${{ github.sha }}."
            echo
            echo "Each library was verified by \`tools/install-release-binaries.py\` before being"
            echo "written: filename against the member, object format and architecture against the"
            echo "directory it claims, and coinxt's export surface. The full static gate set -"
            echo "including every \`MANIFEST.sha256\` and coinxt's binary-freshness check - passed"
            echo "over the result."
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/pr-body.md
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "Refresh the committed native libraries from a release build" \
            --body-file /tmp/pr-body.md
