# release-binaries.yml - ONE dispatch that builds every member's native library
# for every platform it can be built for, and publishes them as a single bundle.
#
# WHY. The per-member native-*.yml workflows already build these matrices, but
# they are paths-filtered (they fire only when their member changes) and each
# uploads its own per-platform artifact. Assembling a release from them means
# waiting on five runs and downloading ~17 artifacts one at a time, which is
# exactly the friction that has left enetxt, datachannelxt, and coinxt shipping
# x86_64-linux only while CI was quietly building the other platforms all along.
# This workflow is the assembly step: run it once, get one bundle.
#
# IT LANDS THEM TOO. The final job installs every built library into its own
# member's src/code/<platform-id>/, refreshes each MANIFEST.sha256, and commits.
#
# That is a deliberate narrowing of suite rule 5, not an abandonment of it. The
# rule exists so a committed binary is always traceable to a human decision and
# to the source that produced it. What it actually forbids is a binary arriving
# without anyone choosing it - and the danger case is an AUTOMATIC workflow: the
# per-member native-*.yml files fire on every push, so a commit step there would
# push binaries nobody asked for, on somebody else's change. Those still upload
# artifacts and nothing else, and that has not changed.
#
# This workflow is different in the one way that matters: it only ever runs
# because a person pressed "Run workflow". The human decision is still there; it
# moved from "download 17 artifacts and run a local command" to "press the
# button". Everything the local installer checked, the commit job still checks,
# because it RUNS the local installer (tools/install-release-binaries.py) rather
# than reimplementing it - name, object format, architecture-vs-directory, and
# coinxt's export surface are all verified before a single file is written, and
# the whole static gate set runs afterwards. A bad artifact fails the job with
# nothing committed.
#
#   commit_mode: branch  (default) commit straight to the branch you dispatched
#                        on. This is what the members' standalone repositories
#                        did before consolidation.
#                pr      push to a release-binaries/<run> branch and open a PR,
#                        when you would rather look before it lands.
#                none    just the bundle; run
#                        `python3 tools/install-release-binaries.py <dir>`
#                        yourself.
#
# macOS LANES EXIST SINCE 2026-08-23, FOR FOUR OF SIX MEMBERS - and the
# paragraph that stood here ("NO macOS LANES AT ALL") is kept in spirit as the
# rule the lanes must obey. The trap it described is real: GitHub's macos-15
# runners are arm64-only, so a PLAIN build there produces a THIN arm64 dylib -
# and the engine's directory for macOS is `universal-mac`, which promises the
# opposite. A naive lane would have replaced sodiumxt's genuine two-architecture
# dylib with a file that fails to load on every Intel Mac, silently and only
# for users. What dissolves the trap is not an Intel runner but the compiler:
# clang cross-compiles both slices in one invocation (CMAKE_OSX_ARCHITECTURES
# for the CMake members, a multi-arch CC for coinxt's build.sh), the recipe
# sodiumxt's and box2dxt's own native-*.yml mac lanes had already proven in CI.
# Every mac lane here ASSERTS `lipo -archs` contains both x86_64 and arm64 at
# birth, tests the arm64 slice natively and the x86_64 slice under Rosetta 2,
# and tools/install-release-binaries.py refuses both a thin Mach-O AND a fat
# container missing a slice - so a lane that regresses cannot land its output.
#
# The dylibs are UNSIGNED in the distribution sense (arm64 code always carries
# the linker's automatic ad-hoc signature; that is what unsigned means on
# macOS). They load from a git checkout or an installed extension; a
# browser-downloaded zip additionally needs its quarantine attribute cleared,
# which is the recorded cost of shipping without notarization.
#
# THE LAST TWO MEMBERS RIDE THE TWO-SLICE-LIPO JOB (added later on 2026-08-23;
# the paragraph here recorded them as staying manual for a few hours).
# torrentxt statically links libtorrent + Boost + OpenSSL and datachannelxt
# takes its DTLS from OpenSSL, so neither can single-pass a universal build -
# the mac-lipo job instead builds the PINNED OpenSSL (and, for torrentxt, the
# pinned Boost headers) per architecture, builds and tests each thin slice
# (arm64 natively, x86_64 under Rosetta), and `lipo -create`s the final
# dylib, which then passes the same both-slices assertions as every other mac
# artifact. These are the heaviest and newest lanes, so the `mac_lipo`
# dispatch input can skip them DELIBERATELY on a first run. What still does
# not exist anywhere: notarization (Apple Developer credentials CI does not
# hold) - the dylibs ship with the linker's ad-hoc signature only, and the
# installer's refusals keep holding the line for hand-assembled bundles.
name: release binaries

on:
  workflow_dispatch:
    inputs:
      commit_mode:
        description: "How to land the built binaries"
        type: choice
        options: [branch, pr, none]
        default: branch
        required: false
      mac_lipo:
        description: "Run the two-slice-lipo mac lanes (torrentxt, datachannelxt) - the heaviest, newest lanes. 'false' skips them DELIBERATELY (the skip is visible in the run), for a first dispatch that proves the rest before betting on these."
        type: choice
        options: ["true", "false"]
        default: "true"
        required: false

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

# Read by default; the commit job raises its own to contents: write. Scoping it
# per job rather than per workflow means every BUILD job runs with no write token
# at all, so the only step that can alter the repository is the one whose whole
# purpose is to.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CMake five
  # sodiumxt, torrentxt, enetxt, datachannelxt and (since 2026-08-23) box2dxt
  # all build through CMake with the same shape, so one matrix covers them.
  # Each member's own
  # tools/package-extension.py does the placing and stripping, exactly as the
  # per-member workflows do - this is an assembly workflow, not a second build
  # system, and it must not diverge from what those lanes produce.
  cmake-members:
    name: ${{ matrix.member }} ${{ matrix.platform_id }}
    strategy:
      fail-fast: false
      matrix:
        # EVERY COMBINATION IS SPELLED OUT, on purpose. The first version of this
        # job used a member x platform cross product with one shared set of
        # per-platform settings, and 9 of 20 jobs failed on the first real run -
        # every one of them a missing dependency, none of them a code problem.
        # The four members genuinely do NOT share a setup: torrentxt needs Boost
        # and OpenSSL and zlib, sodiumxt builds libsodium from source and needs
        # a --host triple to cross to 32-bit, datachannelxt needs OpenSSL (and
        # i386 OpenSSL for the 32-bit lane), enetxt needs nothing at all, and on
        # Windows three of them want different vcpkg ports and sodiumxt wants a
        # different generator entirely. A shared matrix cannot express that.
        #
        # These rows are PORTED VERBATIM from each member's own native-*.yml,
        # which is the copy that is known to work. When a member's dependencies
        # change, change them there and mirror the row here - do not re-derive
        # them, which is what produced the failure above. ONE deliberate
        # exception: torrentxt's x86_64-linux row diverges from its native lane
        # on purpose - the RELEASE build runs in a manylinux container for the
        # portability floor (see that row), while native-torrentxt.yml stays a
        # stock runner because it exists for fast per-push feedback and its
        # artifacts are never committed.
        include:
          # ---- sodiumxt: builds libsodium from source; vcpkg + NMake on Windows
          - member: sodiumxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            apt: g++ cmake ninja-build
          - member: sodiumxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib cmake ninja-build
            # The -m32 must reach the libsodium sub-build too, hence its own
            # CFLAGS and a configure --host; without them the sub-build stays
            # x86_64 and the link fails "incompatible with i386 output".
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DSODIUMXT_LIBSODIUM_CFLAGS=-m32 -DSODIUMXT_LIBSODIUM_CONFIGURE_EXTRA=--host=i686-pc-linux-gnu
          - member: sodiumxt
            platform_id: x86_64-win32
            os: windows-2025
            vcpkg_port: libsodium
            triplet: x64-windows-static
            msvc_arch: amd64
            win_style: nmake
          - member: sodiumxt
            platform_id: x86-win32
            os: windows-2025
            vcpkg_port: libsodium
            triplet: x86-windows-static
            msvc_arch: x86
            win_style: nmake
          # The universal recipe is native-sodiumxt.yml's own, ported verbatim:
          # CMAKE_OSX_ARCHITECTURES fans the shim out to both slices, and the
          # multi-arch CFLAGS reach the libsodium sub-build so its configure
          # compiles fat objects too (clang accepts two -arch flags in one
          # invocation; this is the documented alternative to per-arch builds
          # plus lipo, and the one that lane has been running green).
          - member: sodiumxt
            platform_id: universal-mac
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSODIUMXT_LIBSODIUM_CFLAGS="-arch arm64 -arch x86_64"

          # ---- torrentxt: Boost + OpenSSL + zlib; libtorrent from vcpkg on Windows
          #
          # The x64 RELEASE build runs INSIDE a manylinux_2_28 container so the
          # committed .so floors at glibc 2.28 (AlmaLinux 8) instead of
          # inheriting whatever the stock runner ships (the 2026-08-12 run's
          # artifact measures glibc 2.38 + a dynamic libssl.so.3), with OpenSSL
          # STATIC-linked so no libssl/libcrypto soname is required at all.
          # Why 2_28 and not the manylinux2014 (glibc 2.17) building.md
          # originally sketched: GitHub's node20-based actions (checkout,
          # upload-artifact) refuse to start in a glibc-2.17 container, and the
          # only distro the lower floor would add - CentOS 7 - has been EOL
          # since June 2024. The image tag floats on purpose: the CONTRACT is
          # the floor, and the "Assert the portability floor" step fails the
          # job if an image update ever raises it. Dependencies arrive as
          # pinned, hash-checked downloads in their own step below; the paths
          # in cmake_args are where that step installs them.
          - member: torrentxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            manylinux: "1"
            manylinux_deps: "1"    # Boost + static OpenSSL; torrentxt alone needs them
            cmake_args: -DBOOST_ROOT=/opt/boost-1.86.0 -DOPENSSL_ROOT_DIR=/opt/static-openssl -DOPENSSL_USE_STATIC_LIBS=ON
            build_jobs: 2          # libtorrent from source OOMs a runner at -j4
          - member: torrentxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib ninja-build libboost-dev
            apt_i386: libssl-dev:i386 zlib1g-dev:i386
            build_jobs: 2
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DOPENSSL_SSL_LIBRARY=/usr/lib/i386-linux-gnu/libssl.so -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so -DOPENSSL_INCLUDE_DIR=/usr/include -DZLIB_LIBRARY=/usr/lib/i386-linux-gnu/libz.so -DZLIB_INCLUDE_DIR=/usr/include
          - member: torrentxt
            platform_id: x86_64-win32
            os: windows-2025
            vcpkg_port: libtorrent
            triplet: x64-windows-static
            cmake_args: -DTORRENTXT_USE_SYSTEM_LIBTORRENT=ON
          - member: torrentxt
            platform_id: x86-win32
            os: windows-2025
            vcpkg_port: libtorrent
            triplet: x86-windows-static
            cmake_args: -DTORRENTXT_USE_SYSTEM_LIBTORRENT=ON -A Win32

          # ---- enetxt: ENet is vendored/fetched; no external dependency at all
          - member: enetxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            apt: g++ cmake ninja-build
          - member: enetxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib cmake ninja-build
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
          - member: enetxt
            platform_id: x86_64-win32
            os: windows-2025
            cmake_args: -A x64
          - member: enetxt
            platform_id: x86-win32
            os: windows-2025
            cmake_args: -A Win32
          # ENet has no external dependency, so the universal build is the
          # plain two-arch flag. (native-enetxt.yml's mac lane omitted this
          # flag until 2026-08-23 and was staging a THIN arm64 dylib under the
          # universal-mac name - artifact-only, never committed, but exactly
          # the mislabel the installer exists to refuse.)
          - member: enetxt
            platform_id: universal-mac
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

          # ---- box2dxt: added 2026-08-23, closing a recorded oddity - the
          # member ships committed binaries for all five platforms and had no
          # dispatch that could refresh any of them. Box2D builds from source
          # inside the member's CMake, so every row is dependency-free; the
          # SIMD flags are ported from native-box2dxt.yml with its reasons
          # (AVX2 off keeps the x86_64 slice portable across CPUs; 32-bit x86
          # is scalar so the DLL/so needs no specific CPU features).
          # The x64 row runs in the SAME manylinux container as torrentxt's,
          # and that is a decision being taken conservatively rather than
          # dodged: "box2dxt release lane glibc floor" sat in the ledgers as
          # an open owner decision, and a stock ubuntu-24.04 build would have
          # quietly answered it with glibc 2.39. Flooring at 2.28 like the
          # suite's other containerized release .so costs nothing here (Box2D
          # has no external deps) and is loosenable later; the floor assertion
          # below holds it either way.
          - member: box2dxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            manylinux: "1"
            cmake_args: -DBOX2D_AVX2=OFF
          - member: box2dxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib cmake ninja-build
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DBOX2D_DISABLE_SIMD=ON
          - member: box2dxt
            platform_id: x86_64-win32
            os: windows-2025
            cmake_args: -A x64 -DBOX2D_AVX2=OFF
          - member: box2dxt
            platform_id: x86-win32
            os: windows-2025
            cmake_args: -A Win32 -DBOX2D_DISABLE_SIMD=ON
          - member: box2dxt
            platform_id: universal-mac
            os: macos-15
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DBOX2D_AVX2=OFF

          # ---- datachannelxt: OpenSSL, including the i386 one for the 32-bit lane
          - member: datachannelxt
            platform_id: x86_64-linux
            os: ubuntu-24.04
            apt: g++ cmake ninja-build libssl-dev
          - member: datachannelxt
            platform_id: x86-linux
            os: ubuntu-24.04
            apt: g++-multilib gcc-multilib ninja-build
            apt_i386: libssl-dev:i386
            cmake_args: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DOPENSSL_SSL_LIBRARY=/usr/lib/i386-linux-gnu/libssl.so -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so -DOPENSSL_INCLUDE_DIR=/usr/include
          - member: datachannelxt
            platform_id: x86_64-win32
            os: windows-2025
            vcpkg_port: openssl
            triplet: x64-windows-static
          - member: datachannelxt
            platform_id: x86-win32
            os: windows-2025
            vcpkg_port: openssl
            triplet: x86-windows-static
            cmake_args: -A Win32
    runs-on: ${{ matrix.os }}
    # Empty for every row that does not set one, which Actions treats as "no
    # container" - only the manylinux lane runs containerized.
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: ${{ matrix.member }}
    steps:
      - uses: actions/checkout@v4
      # The manylinux image supplies its own CPython (setup-python cannot
      # install into a container it did not provision).
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: "3.x"

      - name: Acquire apt packages
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      # A SEPARATE apt call, and a separate line for the toolchain above it, both
      # deliberate: the 32-bit C/C++ toolchain provides Scrt1.o, crti.o,
      # lib32stdc++ and lib32gcc that -m32 needs, and folding it in with the
      # i386 library packages makes a resolver conflict take the toolchain down
      # with it (datachannelxt's own workflow carries this note).
      - name: Acquire i386 libraries
        if: matrix.apt_i386
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_i386 }}

      # The image supplies the old-glibc toolchain (gcc-toolset on PATH) and a
      # CPython under /opt/python; cmake and ninja come from that CPython's
      # pip, so the lane never depends on which build tools a given image tag
      # happens to bundle. Shared by every containerized row (torrentxt and,
      # since 2026-08-23, box2dxt), which is why it is a separate step from
      # the Boost/OpenSSL acquisition below - box2dxt needs the tools and
      # none of the dependencies.
      - name: Provision build tools (manylinux lanes)
        if: matrix.manylinux
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          PYBIN=/opt/python/cp312-cp312/bin
          "$PYBIN/python3" -m pip install --quiet cmake ninja
          ln -sf "$PYBIN/python3" /usr/local/bin/python3
          ln -sf "$PYBIN/cmake"   /usr/local/bin/cmake
          ln -sf "$PYBIN/ctest"   /usr/local/bin/ctest
          ln -sf "$PYBIN/ninja"   /usr/local/bin/ninja

      # torrentxt's dependencies are PINNED DOWNLOADS, hash-checked before use
      # (the libsodium discipline: the pin is the integrity gate). Boost is
      # HEADERS ONLY (libtorrent builds via FetchContent and needs nothing
      # linked from Boost), extracted from the b2-nodocs release archive,
      # which carries the flattened boost/ tree. OpenSSL builds static
      # (no-shared no-module) so the resulting .so carries its TLS stack
      # instead of requiring a host libssl soname.
      - name: Acquire pinned deps (torrentxt manylinux lane)
        if: matrix.manylinux_deps
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          command -v perl >/dev/null    # OpenSSL's Configure needs it; the image ships it
          curl -fsSL -o /tmp/boost.tar.gz \
            https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-b2-nodocs.tar.gz
          echo "2128a4c96862b5c0970c1e34d76b1d57e4a1016b80df85ad39667f30b1deba26  /tmp/boost.tar.gz" | sha256sum -c -
          tar -C /opt -xzf /tmp/boost.tar.gz boost-1.86.0/boost
          curl -fsSL -o /tmp/openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz
          echo "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99  /tmp/openssl.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/openssl.tar.gz
          cd /tmp/openssl-3.5.4
          ./Configure linux-x86_64 no-shared no-module no-tests -fPIC \
            --prefix=/opt/static-openssl --libdir=lib >/dev/null
          make -s -j"$(nproc)" >/dev/null 2>&1
          make -s install_sw >/dev/null 2>&1

      - name: Set up vcpkg
        if: matrix.vcpkg_port
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg\vcpkg.exe" install "${{ matrix.vcpkg_port }}:${{ matrix.triplet }}"
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" >> $env:GITHUB_ENV

      # The NMake generator invokes nmake.exe and cl.exe DIRECTLY, so it only
      # works inside an MSVC developer environment. The Visual Studio generator
      # that every other Windows lane uses locates the toolchain itself and
      # needs nothing here - which is exactly why sodiumxt was the only member
      # to fail with "'nmake' '-?' ... no such file or directory" while
      # enetxt, datachannelxt and torrentxt built fine beside it.
      - name: Set up MSVC (Windows, NMake lanes only)
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # sodiumxt's Windows lane needs its own generator and runtime setting, so
      # it gets its own step rather than being bent into the shared one.
      - name: Configure, build, test (sodiumxt / Windows / NMake)
        if: matrix.win_style == 'nmake'
        shell: pwsh
        run: |
          cmake -S . -B build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DSODIUMXT_BUILD_TESTS=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Configure
        if: matrix.win_style != 'nmake'
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}"
            if [ -n "${VCPKG_TARGET_TRIPLET:-}" ]; then
              EXTRA="$EXTRA -DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET}"
            fi
          fi
          flag="$(printf '%s' "${{ matrix.member }}" | tr '[:lower:]' '[:upper:]')_BUILD_TESTS"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-D${flag}=ON" ${{ matrix.cmake_args }} $EXTRA

      - name: Build
        if: matrix.win_style != 'nmake'
        run: cmake --build build --config Release --parallel ${{ matrix.build_jobs || 4 }}

      # --no-tests=error: ctest exits 0 on an EMPTY test set, so without this a
      # misconfigured lane reports green having run nothing. A release artifact
      # that passed no test is worse than no artifact.
      #
      # On the mac lanes this run is the arm64 slice, natively; the x86_64
      # slice gets its own execution below.
      - name: Test
        if: matrix.win_style != 'nmake'
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      # The x86_64 slice, EXECUTED, not just linked. Rosetta 2 runs it on the
      # arm64 runner; the install is idempotent (and `|| true` because on
      # images that preinstall it the updater can exit non-zero - if Rosetta
      # is genuinely absent the test loop below fails loudly anyway). The
      # tests are enumerated from ctest's own JSON rather than run through
      # `arch -x86_64 ctest`, because ctest itself need not carry an x86_64
      # slice and a fat TEST BINARY spawned from an arm64 parent would run
      # arm64 again - the `arch` preference has to wrap the test executable
      # itself, so each registered command is launched under it directly.
      - name: Test the x86_64 slice under Rosetta (mac lanes)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          sudo softwareupdate --install-rosetta --agree-to-license || true
          ctest --test-dir build --show-only=json-v1 > /tmp/ctest-tests.json
          python3 - <<'PYEOF'
          import json, subprocess, sys
          tests = json.load(open("/tmp/ctest-tests.json"))["tests"]
          if not tests:
              sys.exit("no tests registered - nothing proves the x86_64 slice")
          for t in tests:
              cmd = t.get("command")
              if not cmd:
                  continue
              cwd = None
              for prop in t.get("properties", []):
                  if prop.get("name") == "WORKING_DIRECTORY":
                      cwd = prop.get("value")
              print(f"x86_64: {t['name']}", flush=True)
              subprocess.run(["arch", "-x86_64"] + cmd, cwd=cwd, check=True)
          print(f"x86_64 slice: {len(tests)} test(s) passed under Rosetta")
          PYEOF

      - name: Stage the per-platform library
        shell: bash
        run: |
          python3 tools/package-extension.py \
            --platform-id ${{ matrix.platform_id }} --build-dir build

      - name: Confirm something landed
        shell: bash
        run: |
          ls -l "src/code/${{ matrix.platform_id }}/"
          test -n "$(ls src/code/${{ matrix.platform_id }}/${{ matrix.member }}.* 2>/dev/null)"

      # The mac lanes' CONTRACT, asserted where the artifact is born (the
      # manylinux pattern): `universal-mac` promises BOTH slices, and this is
      # the check that turns a dropped CMAKE_OSX_ARCHITECTURES flag into a red
      # job instead of a thin dylib wearing a universal name. The installer
      # re-checks the slice table on the Linux side before anything is
      # committed; this copy fails the lane while the failure is still cheap.
      - name: Assert the dylib is genuinely universal (mac lanes)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          f="src/code/${{ matrix.platform_id }}/${{ matrix.member }}.dylib"
          archs=$(lipo -archs "$f")
          echo "slices: $archs"
          case " $archs " in
            *" x86_64 "*) : ;;
            *) echo "FAIL: no x86_64 slice in $f"; exit 1 ;;
          esac
          case " $archs " in
            *" arm64 "*) : ;;
            *) echo "FAIL: no arm64 slice in $f"; exit 1 ;;
          esac

      # The manylinux lane's CONTRACT, asserted where the artifact is born:
      # nothing dynamic beyond glibc and the loader (OpenSSL, libstdc++,
      # libgcc, Boost all static), and a glibc floor no higher than the
      # image's 2.28. If a future image raises the floor, or a dependency
      # quietly returns to dynamic linking, this fails the job instead of
      # shipping a binary that stopped loading on the older distros the lane
      # exists for. The smoke test already RAN in this container (the Test
      # step above), so the artifact's toolchain is execution-proven too.
      - name: Assert the portability floor (manylinux lane)
        if: matrix.manylinux
        shell: bash
        run: |
          set -euo pipefail
          so="src/code/${{ matrix.platform_id }}/${{ matrix.member }}.so"
          echo "dynamic dependencies:"
          readelf -d "$so" | grep NEEDED || true
          if readelf -d "$so" | grep -E 'Shared library: \[(libssl|libcrypto|libstdc\+\+|libgcc_s|libboost)'; then
            echo "FAIL: a dependency that must be static is dynamic"
            exit 1
          fi
          max=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -1)
          echo "max glibc symbol version referenced: $max"
          highest=$(printf '%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)
          if [ "$highest" != "GLIBC_2.28" ]; then
            echo "FAIL: the glibc floor is above 2.28"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.member }}-${{ matrix.platform_id }}
          path: ${{ matrix.member }}/src/code/${{ matrix.platform_id }}/
          if-no-files-found: error

  # -------------------------------------------------------------------- coinxt
  # coinxt builds from a shell script, not CMake, so it gets its own job.
  #
  # The Windows libraries are CROSS-COMPILED from Linux with MinGW rather than
  # built on a Windows runner. That is not a shortcut: build.sh is POSIX sh, the
  # cross toolchain is one apt install, and it produces the same narrow export
  # surface (verified locally: exactly the 16 cnx_* symbols in the PE export
  # table, via a generated .def - MinGW auto-exports all 77 globals otherwise,
  # and a version script is silently IGNORED for PE, which fails OPEN).
  #
  # EXECUTION, not just a well-formed export table: the kat-windows job below
  # drives the published vectors through the real cross-built DLL on a real
  # Windows runner, so the x86_64-win32 artifact is execution-proven rather than
  # merely correct-looking. Every platform this job emits is covered that way or
  # is native Linux, which build-all already exercises.
  coinxt:
    name: coinxt ${{ matrix.platform_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: x86_64-linux
            os: ubuntu-24.04
            acquire: linux64
          - platform_id: x86-linux
            os: ubuntu-24.04
            acquire: linux32
          - platform_id: x86_64-win32
            os: ubuntu-24.04
            acquire: mingw64
          - platform_id: x86-win32
            os: ubuntu-24.04
            acquire: mingw32
          # The mac build runs build.sh's own dylib path (exported_symbols_list
          # generated from the objects, strip -x, the universal-mac id it has
          # carried since the manual-lipo days) - the only addition is a
          # multi-arch CC, which makes every object and the final link fat in
          # one pass. nm reads fat objects fine; each symbol just appears once
          # per slice, and build.sh's sort -u already collapses that.
          - platform_id: universal-mac
            os: macos-15
            acquire: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: coinxt
    steps:
      - uses: actions/checkout@v4
      # The mac KAT leg below wants a pip that can install ecdsa without
      # negotiating with a brew-managed interpreter (PEP 668).
      - uses: actions/setup-python@v5
        if: matrix.acquire == 'mac'
        with:
          python-version: "3.x"

      - name: Acquire toolchain
        shell: bash
        run: |
          case "${{ matrix.acquire }}" in
            linux64) sudo apt-get update && sudo apt-get install -y gcc ;;
            linux32) sudo apt-get update && sudo apt-get install -y gcc-multilib ;;
            mingw64) sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 ;;
            mingw32) sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 ;;
            mac)     : ;;   # clang ships with the runner
          esac

      # build.sh takes CC/NM/STRIP from the environment precisely so a cross
      # build needs no PATH games, and the platform id is passed EXPLICITLY
      # because uname describes the machine, not the output.
      - name: Build the shipped library
        shell: bash
        run: |
          case "${{ matrix.acquire }}" in
            linux32)
              mkdir -p "$HOME/bin"
              printf '#!/bin/sh\nexec gcc -m32 "$@"\n' > "$HOME/bin/cc"
              chmod +x "$HOME/bin/cc"
              export PATH="$HOME/bin:$PATH"
              ;;
            mingw64)
              export CC=x86_64-w64-mingw32-gcc NM=x86_64-w64-mingw32-nm STRIP=x86_64-w64-mingw32-strip ;;
            mingw32)
              export CC=i686-w64-mingw32-gcc NM=i686-w64-mingw32-nm STRIP=i686-w64-mingw32-strip ;;
            mac)
              export CC="cc -arch arm64 -arch x86_64" ;;
          esac
          sh native/build.sh pack ${{ matrix.platform_id }}

      # The export surface is the one thing that fails OPEN - a wrong mechanism
      # gives you a WORKING library with 77 exports - so assert it per format
      # rather than trusting the build's own printout.
      - name: Assert the export surface is exactly cnx_*
        shell: bash
        run: |
          set -euo pipefail
          d="src/code/${{ matrix.platform_id }}"
          case "${{ matrix.platform_id }}" in
            *-linux)
              leaked=$(nm -D --defined-only "$d/coinxt.so" | awk '{print $NF}' | grep -v '^cnx_' || true) ;;
            *-win32)
              tc=x86_64-w64-mingw32; [ "${{ matrix.platform_id }}" = x86-win32 ] && tc=i686-w64-mingw32
              leaked=$($tc-objdump -p "$d/coinxt.dll" \
                       | awk '/\[Ordinal\/Name Pointer\] Table/{f=1;next} f&&/^$/{exit} f{print $NF}' \
                       | grep -v '^cnx_' || true) ;;
            universal-mac)
              # Mach-O globals carry a leading underscore, and nm on a fat
              # file prints per-arch header lines - the grep for '^_' keeps
              # symbols only, and any export outside _cnx_ leaks. Both slices
              # are listed, so a symbol leaking from EITHER is caught.
              leaked=$(nm -gU "$d/coinxt.dylib" | awk '{print $NF}' \
                       | grep '^_' | sed 's/^_//' | grep -v '^cnx_' || true) ;;
          esac
          if [ -n "$leaked" ]; then
            echo "coinxt exports symbols outside the cnx_ surface:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "export surface OK"

      # Both slices, EXECUTED through the published vectors on the runner that
      # built them - the kat-windows discipline, applied where no second job is
      # needed because the build host IS a mac. The arm64 leg runs natively
      # with the independent-library crosscheck required (the same bar the
      # Windows DLL meets); the x86_64 leg runs the full KAT table under
      # Rosetta through Apple's own /usr/bin/python3, which is universal - the
      # setup-python interpreter need not carry an x86_64 slice, and a fat
      # ctypes dlopen follows the PYTHON process's architecture, so the
      # interpreter choice is what selects the slice under test. That leg
      # skips only the ecdsa crosscheck (system python, no pip packages); the
      # vectors themselves all run.
      - name: Drive the dylib through the published vectors, both slices (mac)
        if: matrix.acquire == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          sudo softwareupdate --install-rosetta --agree-to-license || true
          pip install --quiet ecdsa
          COINXT_REQUIRE_CROSSCHECK=1 python3 tools/coin-kat.py --check \
            --lib src/code/universal-mac/coinxt.dylib
          arch -x86_64 /usr/bin/python3 tools/coin-kat.py --check \
            --lib src/code/universal-mac/coinxt.dylib

      - name: Assert the dylib is genuinely universal (mac)
        if: matrix.acquire == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          archs=$(lipo -archs src/code/universal-mac/coinxt.dylib)
          echo "slices: $archs"
          case " $archs " in *" x86_64 "*) : ;; *) echo "FAIL: no x86_64 slice"; exit 1 ;; esac
          case " $archs " in *" arm64 "*)  : ;; *) echo "FAIL: no arm64 slice";  exit 1 ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-coinxt-${{ matrix.platform_id }}
          path: coinxt/src/code/${{ matrix.platform_id }}/
          if-no-files-found: error

  # An artifact whose export table is right but which nobody ever RAN is a weak
  # thing to ship in a library that handles money. This runs the published KAT
  # vectors against the real cross-built DLL on a real Windows runner, so the
  # x86_64-win32 artifact is execution-proven and not merely well-formed.
  kat-windows:
    name: coinxt x86_64-win32 KATs (on Windows)
    needs: coinxt
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: bundle-coinxt-x86_64-win32
          path: dll
      # With `ecdsa` present this lane does more than replay a table: the
      # signatures the SHIPPED DLL produces are verified in an independent
      # library, on Windows, before the artifact is bundled. Without it that leg
      # would skip and still exit 0, so it is required rather than optional.
      - name: Install the independent crypto implementation
        run: pip install ecdsa
      - name: Drive the DLL through the published vectors
        shell: bash
        env:
          COINXT_REQUIRE_CROSSCHECK: "1"
        run: python3 coinxt/tools/coin-kat.py --check --lib dll/coinxt.dll

  # ------------------------------------------------------------- mac two-slice
  # torrentxt and datachannelxt cannot single-pass a universal build: torrentxt
  # statically links libtorrent + Boost + OpenSSL, datachannelxt's DTLS is
  # OpenSSL, and OpenSSL does not build both architectures in one configure.
  # So this job does what the workflow header's old refusal said macOS "needs
  # work this workflow does not do": build each slice thin - against a
  # PER-ARCH build of the same pinned OpenSSL the manylinux lane uses - test
  # each slice (arm64 natively, x86_64 under Rosetta, the same enumerate-and-
  # wrap pattern as the single-pass mac lanes), and `lipo -create` the final
  # dylib. The result passes the same both-slices birth assertion as every
  # other mac artifact, and the installer re-checks the slice table before
  # anything is committed.
  #
  # These are the heaviest and newest lanes (two OpenSSL builds plus two
  # full member builds each), so the `mac_lipo` dispatch input can skip the
  # whole job deliberately on a first run - the skip is visible in the run,
  # and the commit job accepts a SKIPPED result (an input choice) while
  # refusing a FAILED one (a broken build).
  mac-lipo:
    name: ${{ matrix.member }} universal-mac (two slices + lipo)
    if: github.event.inputs.mac_lipo != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - member: torrentxt
            needs_boost: "1"
            build_jobs: 3
          - member: datachannelxt
            build_jobs: 3
    runs-on: macos-15
    defaults:
      run:
        working-directory: ${{ matrix.member }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rosetta 2 (for the x86_64 test legs)
        shell: bash
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      # The same pinned, hash-checked OpenSSL tarball as the manylinux lane -
      # ONE pin, three build recipes (linux static, darwin arm64, darwin
      # x86_64). OpenSSL's own darwin64-*-cc targets carry the -arch flag, so
      # each build is a clean thin static tree under its own prefix.
      - name: Build the pinned OpenSSL, once per architecture
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL -o openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz
          echo "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99  openssl.tar.gz" | shasum -a 256 -c -
          tar -xzf openssl.tar.gz
          for arch in arm64 x86_64; do
            cp -R openssl-3.5.4 "ossl-src-$arch"
            ( cd "ossl-src-$arch"
              ./Configure "darwin64-$arch-cc" no-shared no-module no-tests \
                --prefix="$RUNNER_TEMP/ossl-$arch" --libdir=lib >/dev/null
              make -s -j4 >/dev/null 2>&1
              make -s install_sw >/dev/null 2>&1 )
            echo "built OpenSSL for $arch -> $RUNNER_TEMP/ossl-$arch"
          done

      # Boost is HEADERS ONLY for torrentxt (the manylinux lane's reasoning
      # verbatim: libtorrent builds via FetchContent and links nothing from
      # Boost), so one extraction serves both slices.
      - name: Acquire the pinned Boost headers (torrentxt)
        if: matrix.needs_boost
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSL -o boost.tar.gz \
            https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-b2-nodocs.tar.gz
          echo "2128a4c96862b5c0970c1e34d76b1d57e4a1016b80df85ad39667f30b1deba26  boost.tar.gz" | shasum -a 256 -c -
          tar -xzf boost.tar.gz boost-1.86.0/boost

      - name: Build and test both slices
        shell: bash
        run: |
          set -euo pipefail
          flag="$(printf '%s' "${{ matrix.member }}" | tr '[:lower:]' '[:upper:]')_BUILD_TESTS"
          extra=""
          if [ -n "${{ matrix.needs_boost }}" ]; then
            extra="-DBOOST_ROOT=$RUNNER_TEMP/boost-1.86.0"
          fi
          for arch in arm64 x86_64; do
            cmake -S . -B "build-$arch" -DCMAKE_BUILD_TYPE=Release "-D${flag}=ON" \
              -DCMAKE_OSX_ARCHITECTURES="$arch" \
              -DOPENSSL_ROOT_DIR="$RUNNER_TEMP/ossl-$arch" \
              -DOPENSSL_USE_STATIC_LIBS=ON $extra
            cmake --build "build-$arch" --parallel ${{ matrix.build_jobs }}
            if [ "$arch" = arm64 ]; then
              ctest --test-dir "build-$arch" --output-on-failure --no-tests=error
            else
              # The x86_64 slice under Rosetta: enumerate from ctest's JSON and
              # wrap each TEST BINARY in `arch -x86_64` directly (same reasoning
              # as the single-pass mac lanes: a fat/thin child spawned from an
              # arm64 parent would run arm64 again; here the binaries are thin
              # x86_64, so the wrapper is what lets an arm64 host run them).
              ctest --test-dir "build-$arch" --show-only=json-v1 > /tmp/ctest-x86.json
              python3 - <<'PYEOF'
          import json, subprocess, sys
          tests = json.load(open("/tmp/ctest-x86.json"))["tests"]
          if not tests:
              sys.exit("no tests registered - nothing proves the x86_64 slice")
          for t in tests:
              cmd = t.get("command")
              if not cmd:
                  continue
              cwd = None
              for prop in t.get("properties", []):
                  if prop.get("name") == "WORKING_DIRECTORY":
                      cwd = prop.get("value")
              print(f"x86_64: {t['name']}", flush=True)
              subprocess.run(["arch", "-x86_64"] + cmd, cwd=cwd, check=True)
          print(f"x86_64 slice: {len(tests)} test(s) passed under Rosetta")
          PYEOF
            fi
          done

      - name: Lipo the two slices and stage through the member's own packager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          lipo -create \
            "build-arm64/${{ matrix.member }}.dylib" \
            "build-x86_64/${{ matrix.member }}.dylib" \
            -output "stage/${{ matrix.member }}.dylib"
          python3 tools/package-extension.py --platform-id universal-mac --build-dir stage

      - name: Assert the dylib is genuinely universal
        shell: bash
        run: |
          set -euo pipefail
          archs=$(lipo -archs "src/code/universal-mac/${{ matrix.member }}.dylib")
          echo "slices: $archs"
          case " $archs " in *" x86_64 "*) : ;; *) echo "FAIL: no x86_64 slice"; exit 1 ;; esac
          case " $archs " in *" arm64 "*)  : ;; *) echo "FAIL: no arm64 slice";  exit 1 ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.member }}-universal-mac
          path: ${{ matrix.member }}/src/code/universal-mac/
          if-no-files-found: error

  bundle:
    name: collect one bundle
    needs: [cmake-members, coinxt, kat-windows, mac-lipo]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: staged
      - name: Lay the bundle out the way the installer expects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          # Artifact names are bundle-<member>-<platform_id>; rebuild
          # <member>/<platform_id>/ from that so the local installer needs no
          # mapping table of its own.
          for d in staged/bundle-*; do
            base=$(basename "$d")
            rest=${base#bundle-}
            member=${rest%%-*}
            platform=${rest#*-}
            mkdir -p "bundle/$member/$platform"
            cp -r "$d"/. "bundle/$member/$platform/"
          done
          find bundle -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: bundle/
          if-no-files-found: error

  # ---------------------------------------------------------------- land them
  # Install every built library into its member's src/code/<platform-id>/,
  # refresh the manifests, and commit.
  #
  # `needs` plus an explicit success check, NOT `if: always()`. The bundle job
  # deliberately runs on partial failure so you can see what DID build;
  # committing must not. A half-built release that lands four platforms of five
  # is worse than no release, because the missing one looks deliberate afterwards.
  commit-binaries:
    name: install into each extension and commit
    needs: [cmake-members, coinxt, kat-windows, mac-lipo, bundle]
    # mac-lipo alone may be SKIPPED (the mac_lipo input is a deliberate,
    # visible choice, and the bundle then simply carries no torrentxt/
    # datachannelxt mac dylib to install); a FAILED mac-lipo still refuses
    # the commit like any other failure - a broken build is not a choice.
    if: >-
      github.event.inputs.commit_mode != 'none' &&
      needs.cmake-members.result == 'success' &&
      needs.coinxt.result == 'success' &&
      needs.kat-windows.result == 'success' &&
      (needs.mac-lipo.result == 'success' || needs.mac-lipo.result == 'skipped') &&
      needs.bundle.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history is not needed, but the REF is: we commit back onto the
      # branch the run was dispatched from, so check that out by name rather than
      # relying on the detached default.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Unpack OUTSIDE the working tree. The bundle is a second copy of every
      # library, so a staging directory inside the checkout is one `git add -A`
      # away from being committed alongside the real update - which is exactly
      # what run 3 did, landing 54.5 MB of duplicates under `incoming/`. The
      # installer takes the bundle path as an argument, so there is no reason
      # for it to live in the repository at all.
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release-bundle

      # The SAME verifier the local path uses - not a reimplementation. It checks
      # each library's filename against the member, its object format and
      # architecture against the directory it claims (read from the ELF/PE/Mach-O
      # header, which is what catches a cross build that reported the build
      # machine's arch), and coinxt's export surface. It refuses to write
      # anything at all if any file fails, so a bad artifact cannot land a
      # partial update.
      - name: Verify, then install into each extension
        run: python3 tools/install-release-binaries.py "$RUNNER_TEMP/release-bundle"

      # Proof the tree is still coherent AFTER the write: the MANIFEST.sha256
      # files the installer just refreshed, coinxt's binary-freshness gate
      # (exports and ABI against the shim source), and every other static gate.
      # If this fails, nothing is pushed.
      - name: Static gates over the updated tree
        run: bash tools/build-all.sh --gates

      # NOTE for anyone editing below: every line of a `run: |` block must stay
      # indented. A multi-line commit message written flush-left terminates the
      # YAML block scalar and breaks the whole workflow file - which is exactly
      # what the first draft of this step did. Hence repeated -m flags (each
      # becomes its own paragraph) rather than an inline multi-line string.
      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every committed binary already matched this build; nothing to do."
            exit 0
          fi
          # `git add -A` is deliberately broad, so bound what it is allowed to
          # have caught. The installer writes in exactly one shape - a library
          # under <member>/src/code/<platform-id>/ or the MANIFEST.sha256 beside
          # it - and anything else staged here is something this job dragged in
          # rather than produced. Refusing is the whole point: run 3 committed a
          # 54.5 MB second copy of the bundle and the push succeeded, because
          # nothing between `git add -A` and `git push` ever looked at the list.
          stray=$(git diff --cached --name-only \
                  | grep -Ev '^[a-z]+xt/src/code/([^/]+/[^/]+|MANIFEST\.sha256)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::staged paths outside <member>/src/code/ - refusing to commit:" >&2
            echo "$stray" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --stat
          git commit \
            -m "Refresh the committed native libraries from a release build" \
            -m "Built by .github/workflows/release-binaries.yml, run ${{ github.run_id }}, from ${{ github.sha }}." \
            -m "Every library was verified by tools/install-release-binaries.py before it was written: filename against the member, object format and architecture against the directory it claims, and coinxt's export surface. The full static gate set, including each MANIFEST.sha256 and coinxt's binary-freshness check, passed over the result."

      # Push with rebase-and-retry: another push can land between our checkout and
      # this step, and losing that race would mean re-running 24 build jobs.
      - name: Push to ${{ github.ref_name }}
        if: steps.commit.outputs.changed == 'true' && github.event.inputs.commit_mode != 'pr'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed"
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing onto the branch tip"
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep $((attempt * 2))
          done
          echo "could not push after 4 attempts" >&2
          exit 1

      - name: Open a pull request instead
        if: steps.commit.outputs.changed == 'true' && github.event.inputs.commit_mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release-binaries/${{ github.run_id }}"
          git push origin "HEAD:$branch"
          {
            echo "Built by \`release-binaries.yml\` (run ${{ github.run_id }}) from ${{ github.sha }}."
            echo
            echo "Each library was verified by \`tools/install-release-binaries.py\` before being"
            echo "written: filename against the member, object format and architecture against the"
            echo "directory it claims, and coinxt's export surface. The full static gate set -"
            echo "including every \`MANIFEST.sha256\` and coinxt's binary-freshness check - passed"
            echo "over the result."
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
