# lce-packages.yml - the suite's extensions as finished .lce packages, the
# files an end user installs with Tools > Extension Manager > + in any IDE
# built on LiveCode Community 9 (LiveCode Community 9.6.3, OpenXTalk,
# HyperXTalk, OXT-Beyond). One package per extension: every LiveCode
# Builder library with its native code for every committed platform, and
# every script library (`python3 tools/build-lce-packages.py list` names
# them; its `table` holds every extension member of the registry to a
# package). tools/build-lce-packages.py says what a package holds and why;
# tools/lce-engine-check.lc is the engine's half.
#
# WHAT A RUN DOES, in about five minutes on one Linux runner (plus a minute
# on Windows for the Visual C++ runtime):
#   1. vc-runtime (windows-2022): the Visual C++ runtime DLLs that enetxt's
#      and box2dxt's Windows libraries import, from the image's Visual
#      Studio redistributable, so that those two packages load on a PC
#      without the Visual C++ Redistributable. The packager checks them
#      against the pins OXT-Beyond's own build uses.
#   2. packages (ubuntu-24.04): OXT-Beyond's lc-compile and server engine
#      from a pinned OXT-Beyond release (OXT_BEYOND_TAG, its -binaries
#      archive checked against OXT_BEYOND_BINARIES_SHA256), then
#        build-lce-packages.py stage   compile and assemble every package
#        lce-engine-check.lc docs      api.lcdoc for the Dictionary, by
#                                      Beyond's docs parser
#        build-lce-packages.py pack    the .lce files and SHA256SUMS
#        lce-engine-check.lc verify    every package validated by the
#                                      Extension Manager's own code,
#                                      extracted, loaded and probed on the
#                                      engine, as the IDE installs it
#      and uploads the packages as the artifact xtalk-suite-lce.
#   3. release, only on a dispatch that names a release_tag: the same files
#      attached to that GitHub release, which is created as a draft
#      pre-release when it does not exist yet. Pressing Run with a tag is
#      the human decision, and pressing Publish on the draft puts it on the
#      extensions site (pages.yml).
#   4. publish, only on a push to main (2026-11-21): the owner's rule is
#      that every extension the suite makes is on the extensions site for
#      HyperXTalk and LiveCode Community, so the site follows main instead
#      of waiting for someone to remember a dispatch (box3dxt joined with
#      its libraries and no package, and was not on it). `build-lce-packages.py
#      plan` compares this run's packages with the newest published release:
#      when any differs (a new package, version or platform, one dropped,
#      or other bytes at the same version: a fix must reach the site too,
#      and the build is deterministic, so only a real change differs), this
#      job publishes them as a dated pre-release, vYYYY.MM.DD (.2, .3, ...
#      for a second the same day), and starts pages.yml, which a release
#      the workflow token publishes would not start by itself. Identical
#      packages publish nothing. LCE_AUTO_PUBLISH 'false' leaves each such
#      release a draft for a press of Publish.
#      Safe to hold contents: write here: it runs only for a push to main,
#      so on main's own reviewed tree, and attaches only this run's
#      packages, which this run's engine check passed; a pull request's
#      run never reaches it. A run for an older commit that finishes after
#      a newer one's publishes nothing (the newest release must be its
#      ancestor).
#
# The engine check runs on Linux x86-64 only: the Windows, macOS, arm64 and
# 32-bit libraries in the packages are the committed ones that
# release-binaries.yml built and the native lanes test, and a package only
# carries them (verified statically for those platforms; needs an IDE pass).
name: lce packages

on:
  push:
    branches: [main]
    paths: &lce-paths
      - '.github/workflows/lce-packages.yml'
      - 'tools/build-lce-packages.py'
      - 'tools/test-build-lce-packages.py'
      - 'tools/lce-engine-check.lc'
      - 'sodiumxt/src/**'
      - 'torrentxt/src/**'
      - 'enetxt/src/**'
      - 'datachannelxt/src/**'
      - 'box2dxt/src/**'
      - 'coinxt/src/**'
      - 'coinxt/native/vendor/**'
      - 'curlxt/src/**'
      - 'box3dxt/src/**'
      - 'audioxt/src/**'
      - 'render3dxt/src/**'
      - 'xlsxt/src/**'
      - 'gamepadxt/src/**'
      - 'pdfxt/src/**'
      - 'webpxt/src/**'
      - 'barcodext/src/**'
      - 'oscxt/src/**'
      - 'midixt/src/**'
      - 'artnetxt/src/**'
      - 'onionxt/src/**'
      - 'nostrxt/src/**'
      - '*/examples/*-helpers.livecodescript'
      - '*/LICENSE'
      - '*/THIRD-PARTY-LICENSES.md'
  pull_request:
    paths: *lce-paths
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the packages to this GitHub release (created as a draft pre-release if it does not exist); empty = artifact only'
        required: false
        default: ''

concurrency:
  group: lce-packages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The OXT-Beyond release whose lc-compile builds the modules and whose
  # server engine, docs parser and extension-utils check them. Its
  # bytecode is LiveCode 9's (kMCScriptModuleVersion_9_0_0_DP_4, the same
  # header LiveCode Community 9.6.3 reads), and an IDE that cannot load
  # module.lcm recompiles it from the .lcb in the package.
  OXT_BEYOND_REPO: SethMorrowSoftware/OpenXTalk-Beyond
  OXT_BEYOND_TAG: v0.2.7-rc.6
  OXT_BEYOND_BINARIES: OXT-Beyond-0.2.7-rc.6-linux-x86_64-binaries.tar.xz
  OXT_BEYOND_BINARIES_SHA256: 12504ee02cbf26c59f218263724790853b50993ebdda02546df66bcf6525add8
  DOCS_PARSER_SHA256: 539f8052a9fca16302cd206b6826a06b091a16c03a66a1f95d70faf644555a19
  EXTENSION_UTILS_SHA256: 68d1e6957201eeb0ed82937f48ab763eb2771bedd82145d6ad9f055bd1f57790
  # The publish job (header, step 4): 'true' publishes what main brings the
  # site, 'false' leaves it a draft pre-release for a press of Publish
  LCE_AUTO_PUBLISH: 'true'

defaults:
  run:
    shell: bash

jobs:
  vc-runtime:
    name: Visual C++ runtime
    # windows-2022: its Visual Studio 2022 redistributable (14.44.35112) is
    # the one VC_RUNTIME_PINS in tools/build-lce-packages.py pins
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Copy the runtime DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object { $_.Name -match '^[0-9.]+$' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $redist) { throw "no VC\Redist\MSVC\<version> under $vs" }
          Write-Host "redistributable $($redist.FullName)"
          foreach ($arch in 'x64', 'x86') {
            $crt = Get-ChildItem "$($redist.FullName)\$arch" -Directory | Where-Object { $_.Name -match '^Microsoft\.VC1[0-9]+\.CRT$' } | Sort-Object Name | Select-Object -Last 1
            if (-not $crt) { throw "no $arch\Microsoft.VC14x.CRT in $($redist.FullName)" }
            New-Item -ItemType Directory -Force -Path "vc-runtime\$arch" | Out-Null
            Copy-Item "$($crt.FullName)\*.dll" "vc-runtime\$arch\"
          }
          Set-Content -Path vc-runtime\REDIST.txt -Value $redist.Name
          Get-ChildItem -Recurse vc-runtime | Format-Table -AutoSize FullName, Length

      - name: Upload the runtime DLLs
        uses: actions/upload-artifact@v4
        with:
          name: vc-runtime
          path: vc-runtime
          if-no-files-found: error
          retention-days: 1

  packages:
    name: Build and check the packages
    needs: vc-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The packager's fixtures and table
        run: |
          python3 tools/test-build-lce-packages.py
          python3 tools/build-lce-packages.py table

      - name: Cache OXT-Beyond's tools
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oxt
          key: oxt-beyond-lce-${{ env.OXT_BEYOND_TAG }}-${{ env.OXT_BEYOND_BINARIES_SHA256 }}-${{ env.DOCS_PARSER_SHA256 }}-${{ env.EXTENSION_UTILS_SHA256 }}

      # lc-compile, modules/lci, the server engine and its revZip/revXML
      # externals from the release's binaries archive (the folder is renamed
      # from linux-x86_64-bin: a folder of that name in the engine's path
      # makes the engine look for a source checkout), and the docs parser and
      # extension-utils from the same tag, each checked against its pin
      - name: Fetch OXT-Beyond's tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          oxt="$RUNNER_TEMP/oxt"
          mkdir -p "$oxt"
          base="https://github.com/$OXT_BEYOND_REPO/releases/download/$OXT_BEYOND_TAG"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/bin.tar.xz" "$base/$OXT_BEYOND_BINARIES"
          echo "$OXT_BEYOND_BINARIES_SHA256  $RUNNER_TEMP/bin.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/bin.tar.xz" -C "$oxt" --wildcards \
            'linux-x86_64-bin/lc-compile' 'linux-x86_64-bin/server-community' \
            'linux-x86_64-bin/server-revzip.so' 'linux-x86_64-bin/server-revxml.so' \
            'linux-x86_64-bin/modules/lci/*'
          mv "$oxt/linux-x86_64-bin" "$oxt/engine"
          rm "$RUNNER_TEMP/bin.tar.xz"
          raw="https://raw.githubusercontent.com/$OXT_BEYOND_REPO/$OXT_BEYOND_TAG"
          curl -sSfL --retry 4 -o "$oxt/revdocsparser.livecodescript" "$raw/ide-support/revdocsparser.livecodescript"
          curl -sSfL --retry 4 -o "$oxt/extension-utils.livecodescript" \
            "$raw/extensions/script-libraries/extension-utils/extension-utils.livecodescript"
          echo "$DOCS_PARSER_SHA256  $oxt/revdocsparser.livecodescript" | sha256sum -c -
          echo "$EXTENSION_UTILS_SHA256  $oxt/extension-utils.livecodescript" | sha256sum -c -
          curl -sSfL --retry 4 -o "$oxt/OpenSSL-LICENSE.txt" \
            https://raw.githubusercontent.com/openssl/openssl/d3c1b1169b3569ff3069e5b399f47b2b28e03d79/LICENSE.txt

      - name: Download the runtime DLLs
        uses: actions/download-artifact@v4
        with:
          name: vc-runtime
          path: ${{ runner.temp }}/vc-runtime

      # A release build (the pinned Visual C++ runtime or nothing) for a
      # dispatch with a tag and for a push to main, whose packages the
      # publish job may put on the site
      - name: Stage the packages
        env:
          RELEASE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '--release' || '' }}
        run: |
          echo "Visual C++ redistributable on the runner: $(cat "$RUNNER_TEMP/vc-runtime/REDIST.txt")"
          python3 tools/build-lce-packages.py stage --bin "$RUNNER_TEMP/oxt/engine" \
            --out "$RUNNER_TEMP/stage" --vc-runtime "$RUNNER_TEMP/vc-runtime" \
            --openssl-licence "$RUNNER_TEMP/oxt/OpenSSL-LICENSE.txt" $RELEASE

      - name: Write the Dictionary docs
        run: |
          set +e
          "$RUNNER_TEMP/oxt/engine/server-community" tools/lce-engine-check.lc docs \
            "$RUNNER_TEMP/stage" "$RUNNER_TEMP/oxt/revdocsparser.livecodescript" | tee "$RUNNER_TEMP/docs.log"
          status="${PIPESTATUS[0]}"
          grep -q '^SUMMARY ' "$RUNNER_TEMP/docs.log" || { echo "::error::the docs step did not finish"; exit 1; }
          exit "$status"

      - name: Pack
        run: python3 tools/build-lce-packages.py pack "$RUNNER_TEMP/stage" --out "$RUNNER_TEMP/lce" --release

      - name: Install, load and probe every package on the engine
        run: |
          set +e
          "$RUNNER_TEMP/oxt/engine/server-community" tools/lce-engine-check.lc verify \
            "$RUNNER_TEMP/lce" "$RUNNER_TEMP/oxt/extension-utils.livecodescript" "$RUNNER_TEMP/installed" \
            | tee "$RUNNER_TEMP/verify.log"
          status="${PIPESTATUS[0]}"
          grep -q '^SUMMARY ' "$RUNNER_TEMP/verify.log" || { echo "::error::the engine check did not finish"; exit 1; }
          {
            echo "### lce packages"
            echo
            echo "| Package | Bytes | SHA-256 |"
            echo "| --- | --- | --- |"
            while read -r sum name; do
              echo "| \`$name\` | $(stat -c %s "$RUNNER_TEMP/lce/$name") | \`${sum:0:16}...\` |"
            done < "$RUNNER_TEMP/lce/SHA256SUMS"
            echo
            echo "Engine check: $(grep '^SUMMARY ' "$RUNNER_TEMP/verify.log" | awk '{print $2 " passed, " $3 " failed"}') on OXT-Beyond $OXT_BEYOND_TAG (Linux x86-64)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: xtalk-suite-lce
          path: |
            ${{ runner.temp }}/lce/*.lce
            ${{ runner.temp }}/lce/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the release
    needs: packages
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xtalk-suite-lce
          path: lce

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::release_tag '$TAG' is not a tag name"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            {
              echo "The xTalk Suite extensions by Seth Morrow, as .lce packages built from $GITHUB_SHA by run $GITHUB_RUN_ID."
              echo
              echo "Install one in any IDE built on LiveCode Community 9 (LiveCode Community 9.6.3, OpenXTalk,"
              echo "HyperXTalk, OXT-Beyond): Tools > Extension Manager > + , then choose the .lce file."
              echo "Install a library before its helpers or script layer (for example torrentxt before"
              echo "torrentxt-helpers). SHA256SUMS lists every file's SHA-256."
            } > notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --title "xTalk Suite extensions $TAG" --notes-file notes.md
          else
            # An existing release keeps its version only if these packages
            # were built from the commit it names: a dispatch from another
            # ref would otherwise replace its assets with packages of
            # unrelated source and checksums that still agree with them.
            # The tag's commit when the tag exists; a draft's tag may not
            # exist yet, so then the release's target (a branch or a SHA).
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
              ref="$TAG"
            else
              ref=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            fi
            target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::release $TAG names $ref ($target), but these packages were built from $GITHUB_SHA; run the workflow from that commit's tag or branch"
              exit 1
            fi
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber lce/*.lce lce/SHA256SUMS

  publish:
    name: Publish what changed to the extensions site
    needs: packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # one at a time, in push order: each compares with the release the one
    # before it may have just published
    concurrency:
      group: lce-packages-publish
      cancel-in-progress: false
    permissions:
      contents: write   # the release and its tag
      actions: write    # start pages.yml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: xtalk-suite-lce
          path: ${{ runner.temp }}/lce

      - name: Compare with the newest published release
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 tools/build-lce-packages.py plan "$RUNNER_TEMP/lce" --repo "$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/plan.txt"
          { echo "### What this push brings the extensions site"; echo; echo '```'
            cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ steps.plan.outputs.baseline }}
        # tools/test-build-lce-packages.py runs this block, between its
        # markers, against a gh that answers as GitHub would
        run: |
          # >>> publish
          set -euo pipefail
          # A run for an older commit that finishes after a newer one's must
          # not publish over it: when the newest release was built from this
          # commit or a later one, this run has nothing to add. (A release
          # dispatched from a branch is neither: "diverged" publishes, since
          # the plan found how this commit's packages differ from it.)
          if [ -n "$BASELINE" ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASELINE" --jq .sha)
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq .status)
            case "$status" in
              ahead|diverged) ;;
              *)
                echo "Compared with the newest release, $BASELINE ($base), $GITHUB_SHA is $status: nothing published." \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac
          fi
          day="v$(date -u +%Y.%m.%d)"
          tag="$day"
          n=1
          # (a tag without a release is taken too: a release on it would
          # name that tag's commit, not this one)
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
                gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; do
            n=$((n + 1))
            tag="$day.$n"
          done
          # Created as a draft with every file, then published: a visitor
          # never sees a release with half its packages
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "xTalk Suite extensions $tag" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/lce/*.lce "$RUNNER_TEMP/lce/SHA256SUMS"
          if [ "$LCE_AUTO_PUBLISH" != true ]; then
            echo "Drafted $tag: press Publish on it to put it on the extensions site." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
          echo "Published $tag and started the extensions site (pages.yml)." | tee -a "$GITHUB_STEP_SUMMARY"
          # <<< publish
