# midixt's native build matrix, at the ROOT of the monorepo (GitHub runs only
# root workflows here; member workflows are generated for published repos).
#
# WHAT IT DOES NOT DO: it does not commit binaries. Each lane uploads its
# library as an ARTIFACT; committed binaries come from the suite's manual
# release-binaries.yml dispatch (suite rule 5).
#
# THREE JOBS, each the proof of one sentence in the member's README:
#   sanitize      the real library's smoke test and the shim against the mock
#                 RtMidi under ASan/UBSan: every failure path RtMidi has
#                 (a dead backend, a throwing read, a full queue) driven with
#                 no MIDI service at all;
#   engine        on Linux, Windows and macOS: the library and the mock
#                 built and tested, then the binding compiled by OXT-Beyond's
#                 lc-compile -Werror and RUN under lc-run, and the Script
#                 layer run in the standalone engine with -ui, all with
#                 MIDIXT_REQUIRE_ALL so a suite that cannot run fails instead
#                 of skipping. Where a MIDI service with virtual ports is
#                 there (CoreMIDI on macOS always; the ALSA sequencer on Linux
#                 when the runner's kernel can load it), MIDIXT_REQUIRE_SERVICE
#                 makes the shipped self-test's loopback tier a must: a real
#                 message out of one port and into another. The Windows and
#                 macOS rows' libraries are the artifacts for those ids;
#   build-matrix  the other platform ids the release workflow builds, tested:
#                 the 64-bit Linux rows in the manylinux_2_28 image the
#                 release rows use, 32-bit Linux and 32-bit Windows.
# There is no Android row: RtMidi's Android backend needs API 29 and JNI, and
# the suite's floor is API 21 (CMakeLists.txt refuses the configure).
name: native midixt

on:
  pull_request:
    paths:
      - "midixt/**"
      - "!midixt/docs/**"
      - "!midixt/**/*.md"
      - "midixt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-midixt.yml"
  push:
    branches: [main]
    paths:
      - "midixt/**"
      - "!midixt/docs/**"
      - "!midixt/**/*.md"
      - "midixt/THIRD-PARTY-LICENSES.md"
      - ".github/workflows/native-midixt.yml"
  workflow_dispatch:

concurrency:
  group: native-midixt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"
  # The OXT-Beyond release whose tools and engines the `engine` job runs:
  # the release lce-packages.yml and the other native lanes pin, so one
  # engine build compiles and runs every member's modules. Each archive's
  # SHA-256 is pinned in the matrix row that downloads it (the release's own
  # digests, read 2026-11-21).
  OXT_BEYOND_REPO: SethMorrowSoftware/OpenXTalk-Beyond
  OXT_BEYOND_TAG: v0.2.7-rc.6

defaults:
  run:
    working-directory: midixt

jobs:
  sanitize:
    name: ASan+UBSan (linux x86_64, real library + mock)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Acquire toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build libasound2-dev
      - name: Configure + build + test under sanitizers
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMIDIXT_BUILD_TESTS=ON \
            -DMIDIXT_SANITIZE=address
          cmake --build build-asan
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
          ctest --test-dir build-asan --output-on-failure --no-tests=error

  engine:
    name: engine ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            cmake_args: ""
            oxt: OXT-Beyond-0.2.7-rc.6-linux-x86_64-binaries.tar.xz
            oxt_sha256: 12504ee02cbf26c59f218263724790853b50993ebdda02546df66bcf6525add8
            artifact: ""
          # Windows MM has no virtual ports (the shim refuses them, since
          # Windows MM "opens" one that sends nowhere), so the loopback tier
          # skips here with that reason; the rest of the self-test runs.
          - name: windows-x86_64
            os: windows-2025
            cmake_args: "-A x64"
            oxt: OXT-Beyond-0.2.7-rc.6-win-x86_64-binaries.zip
            oxt_sha256: 49607dd4bb15648550bf31a5de652cc9cf0fbf49632e63bf2cc5612fc190296b
            artifact: x86_64-win32
          - name: macos-universal
            os: macos-15
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            oxt: OXT-Beyond-0.2.7-rc.6-mac-universal-binaries.tar.xz
            oxt_sha256: 7f043df59a2540c6b8c7d8a96d649793af975d96826fec84d052b12726c872d7
            artifact: universal-mac
            require_service: "1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ALSA's headers for the build, and the standalone engine's core
      # libraries (OXT-Beyond's Installer/linux/libraries.txt); -ui needs no
      # X display.
      - name: ALSA headers and engine runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libglib2.0-0t64 libfontconfig1 libfreetype6

      # The ALSA sequencer is a kernel module (snd-seq); a cloud runner has
      # no sound card, but the sequencer needs none, and RtMidi's virtual
      # ports and their loopback live entirely inside it. Whether this
      # runner's kernel can load it is the runner's business, so the step
      # says which happened, in the log and in the run's summary, and only
      # a sequencer that is really there makes the loopback tier a must.
      - name: Bring up the ALSA sequencer if this runner can (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -u
          if [ ! -e /dev/snd/seq ]; then
            sudo modprobe snd-seq 2>/dev/null ||
              { sudo apt-get install -y "linux-modules-extra-$(uname -r)" > /dev/null 2>&1 &&
                sudo modprobe snd-seq; } || true
          fi
          if [ -e /dev/snd/seq ]; then
            sudo chmod a+rw /dev/snd/seq
            echo "MIDIXT_REQUIRE_SERVICE=1" >> "$GITHUB_ENV"
            echo "- Linux: the ALSA sequencer is up (/dev/snd/seq), so the self-test's loopback tier had to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::no ALSA sequencer on this runner (snd-seq did not load): on Linux the self-test's loopback tier skips, with the reason"
            echo "- Linux: NO ALSA sequencer on this runner; the self-test's loopback tier skipped there (macOS runs it)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMIDIXT_BUILD_TESTS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      # ctest ran the arm64 slice. The x86_64 slice is EXECUTED too, each
      # registered test launched through `arch` itself (a fat test spawned
      # from an arm64 parent would run arm64 again).
      - name: Test the x86_64 slice under Rosetta (mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo softwareupdate --install-rosetta --agree-to-license || true
          lipo -archs build/midixt.dylib | grep -q x86_64
          lipo -archs build/midixt.dylib | grep -q arm64
          ctest --test-dir build --show-only=json-v1 > "$RUNNER_TEMP/ctest.json"
          python - "$RUNNER_TEMP/ctest.json" <<'PYEOF'
          import json, subprocess, sys
          tests = json.load(open(sys.argv[1]))["tests"]
          if not tests:
              sys.exit("no tests registered: nothing proves the x86_64 slice")
          for t in tests:
              print("x86_64:", t["name"], flush=True)
              subprocess.run(["arch", "-x86_64"] + t["command"], check=True,
                             cwd=next((p["value"] for p in t.get("properties", [])
                                       if p["name"] == "WORKING_DIRECTORY"), None))
          print("x86_64 slice: %d test(s) passed under Rosetta" % len(tests))
          PYEOF

      # lc-compile, lc-run, modules/lci and the standalone engine from the
      # release's binaries archive, checked against its pin. The Linux
      # folder is renamed from linux-x86_64-bin: a folder of that name in
      # the engine's path makes the engine look for a source checkout.
      - name: Fetch OXT-Beyond's engine and tools
        shell: bash
        run: |
          set -euo pipefail
          oxt="$RUNNER_TEMP/oxt"
          mkdir -p "$oxt"
          curl -sSfL --retry 4 -o "$RUNNER_TEMP/oxt-archive" \
            "https://github.com/$OXT_BEYOND_REPO/releases/download/$OXT_BEYOND_TAG/${{ matrix.oxt }}"
          have=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$RUNNER_TEMP/oxt-archive")
          if [ "$have" != "${{ matrix.oxt_sha256 }}" ]; then
            echo "::error::${{ matrix.oxt }} has SHA-256 $have, pinned ${{ matrix.oxt_sha256 }}"
            exit 1
          fi
          case "${{ matrix.oxt }}" in
            *.zip) python -m zipfile -e "$RUNNER_TEMP/oxt-archive" "$oxt" ;;
            *)     tar -xJf "$RUNNER_TEMP/oxt-archive" -C "$oxt" ;;
          esac
          rm "$RUNNER_TEMP/oxt-archive"
          if [ -d "$oxt/linux-x86_64-bin" ]; then mv "$oxt/linux-x86_64-bin" "$oxt/engine"; fi
          lcc=$(find "$oxt" -maxdepth 2 -type f \( -name lc-compile -o -name lc-compile.exe \) | head -n 1)
          [ -n "$lcc" ] || { echo "::error::no lc-compile in ${{ matrix.oxt }}"; exit 1; }
          bin=$(dirname "$lcc")
          chmod +x "$bin"/lc-compile* "$bin"/lc-run* 2>/dev/null || true
          echo "OXT_BIN=$bin" >> "$GITHUB_ENV"
          echo "toolchain: $bin"

      # -Werror, as the IDE's Extension Builder compiles; every public Test*
      # handler in its own lc-run process: the mock suite and the real
      # library's. The floor guards a run that collapsed to a few
      # assertions (181 on Linux, 2026-11-21; Windows asserts a few fewer
      # where it has no virtual ports).
      - name: The binding under lc-run (tests/lcb)
        shell: bash
        env:
          MIDIXT_REQUIRE_ALL: "1"
        run: python tools/run-lcb-tests.py --oxt-bin "$OXT_BIN" --build-dir build --min-assertions 160 --tap-out "$RUNNER_TEMP/lcb-tests.tap"

      # The Script layer in the standalone engine with -ui: the boundary and
      # the helper's listener over the mock, and the shipped self-test over
      # the real library (109 assertions on Linux, 2026-11-21).
      - name: The Script layer in the engine (tests/lcs)
        shell: bash
        env:
          MIDIXT_REQUIRE_ALL: "1"
        run: |
          if [ "${{ matrix.require_service }}" = "1" ]; then export MIDIXT_REQUIRE_SERVICE=1; fi
          echo "MIDIXT_REQUIRE_SERVICE=${MIDIXT_REQUIRE_SERVICE:-}"
          python tools/run-lcs-tests.py --oxt-bin "$OXT_BIN" --build-dir build --min-assertions 95 -v

      - name: Keep the TAP stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midixt-engine-${{ matrix.name }}-tap
          path: ${{ runner.temp }}/lcb-tests.tap
          if-no-files-found: ignore

      # The shipped library only: build/mock/ holds the mock under the same
      # name, and it must never ship (tools/package-extension.py refuses it).
      - name: Stage the library
        if: matrix.artifact != ''
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          for f in build/midixt.dylib build/Release/midixt.dll; do
            if [ -f "$f" ]; then cp "$f" "dist/${{ matrix.artifact }}/"; fi
          done
          test -n "$(ls "dist/${{ matrix.artifact }}/")"

      - name: Upload binary artifact
        if: matrix.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: midixt-${{ matrix.artifact }}
          path: midixt/dist/${{ matrix.artifact }}/
          if-no-files-found: error

  build-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two 64-bit Linux rows build where the release rows do: the
          # manylinux_2_28 image (glibc 2.28, its own gcc), so the compiler
          # and C library a release dispatch will use are the ones tested
          # here on every change. ALSA's headers come from the image's dnf.
          - name: linux-x86_64
            os: ubuntu-24.04
            platform_id: x86_64-linux
            container: quay.io/pypa/manylinux_2_28_x86_64
            acquire: manylinux
            cmake_args: ""
          # -m32 on a stock runner, ShowControl's recipe: the i386 ALSA
          # library named for CMake's FindALSA, which looks in the 64-bit
          # directories otherwise.
          - name: linux-x86
            os: ubuntu-24.04
            platform_id: x86-linux
            acquire: linux32
            cmake_args: >-
              -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
              -DCMAKE_LIBRARY_ARCHITECTURE=i386-linux-gnu
              -DALSA_LIBRARY=/usr/lib/i386-linux-gnu/libasound.so
              -DALSA_INCLUDE_DIR=/usr/include
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform_id: arm64-linux
            container: quay.io/pypa/manylinux_2_28_aarch64
            acquire: manylinux
            cmake_args: ""
          - name: windows-x86
            os: windows-2025
            platform_id: x86-win32
            acquire: none
            cmake_args: "-A Win32"
    runs-on: ${{ matrix.os }}
    # Empty for every row that does not set one, which Actions treats as "no
    # container".
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      # release-binaries.yml's step: cmake and ninja from the image's CPython,
      # ALSA's headers from the image's package manager.
      - name: Provision build tools (manylinux rows)
        if: matrix.acquire == 'manylinux'
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          PYBIN=/opt/python/cp312-cp312/bin
          "$PYBIN/python3" -m pip install --quiet cmake ninja
          ln -sf "$PYBIN/python3" /usr/local/bin/python3
          ln -sf "$PYBIN/cmake"   /usr/local/bin/cmake
          ln -sf "$PYBIN/ctest"   /usr/local/bin/ctest
          ln -sf "$PYBIN/ninja"   /usr/local/bin/ninja
          dnf -y install alsa-lib-devel > /dev/null
          git config --global --add safe.directory '*'

      # Two apt calls on purpose: the -m32 toolchain, then the i386 library,
      # so a resolver conflict cannot take both down unseen.
      - name: Acquire 32-bit toolchain and ALSA (Linux x86)
        if: matrix.acquire == 'linux32'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib cmake ninja-build
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libasound2-dev:i386

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMIDIXT_BUILD_TESTS=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (ctest)
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Stage the library
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform_id }}"
          for f in build/midixt.so build/Release/midixt.dll; do
            if [ -f "$f" ]; then cp "$f" "dist/${{ matrix.platform_id }}/"; fi
          done
          test -n "$(ls "dist/${{ matrix.platform_id }}/")"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midixt-${{ matrix.platform_id }}
          path: midixt/dist/${{ matrix.platform_id }}/
          if-no-files-found: ignore
