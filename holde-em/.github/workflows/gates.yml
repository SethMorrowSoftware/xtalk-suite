# GENERATED by tools/sync-member-workflows.py
# (https://github.com/SethMorrowSoftware/xtalk-suite; the registry row is tools/member-registry.py).
#
# holde-em's compiler-free gates, as its OWN repository runs them on every
# push: `bash tools/run-gates.sh`, the member's own list. Inside the suite
# monorepo this file is inert (GitHub Actions reads only the root
# .github/workflows/), and tools/build-all.sh --gates runs the same script
# there. There is no headless way to compile or run a .livecodescript, so
# these are the static gates plus every known-answer, golden and
# execution-gate check that CAN run without an engine; anything visual,
# timed or extension-touching stays 'verified statically; needs an OXT
# pass' (the honesty convention).
#
# THE SIBLING CHECKOUTS. Some of this member's gates reach into sibling
# members (riptide, nostrxt, coinxt) - a committed binary to execute against, an
# interpreter or a boot runner to reuse rather than copy. The tools find
# them as ../<name> beside the member, so this job checks the member out
# into a directory named after it and each sibling beside it, from that
# sibling's own repository at its default branch. XTALK_REQUIRE_SIBLINGS
# turns 'sibling absent, tier skipped' into a failure: in CI a skip and a
# pass both exit 0, and a lane that can pass by measuring nothing is the
# shape this family's tests/cross-member-test.py records.
#
# Do not edit by hand: edit tools/member-registry.py or the generator in
# the suite and re-run `python3 tools/sync-member-workflows.py`.
name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: static gates + golden vectors + execution gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: holde-em
    steps:
      - uses: actions/checkout@v4
        with:
          path: holde-em
      - name: Check out riptide beside it (SethMorrowSoftware/RipTide)
        uses: actions/checkout@v4
        with:
          repository: SethMorrowSoftware/RipTide
          path: riptide
      - name: Check out nostrxt beside it (SethMorrowSoftware/NostrXT)
        uses: actions/checkout@v4
        with:
          repository: SethMorrowSoftware/NostrXT
          path: nostrxt
      - name: Check out coinxt beside it (SethMorrowSoftware/CoinXT)
        uses: actions/checkout@v4
        with:
          repository: SethMorrowSoftware/CoinXT
          path: coinxt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the member's own gates
        env:
          XTALK_REQUIRE_SIBLINGS: "1"
        run: bash tools/run-gates.sh
